schema_version = 1

[app]
id = "todo"
type = "app"
name = "Todo"
version = "0.1.0"
description = "Simple todo list. Items persist across relaunches in host-owned app state."
entry = "todo.py"

[runtime]
python_compat = true

[app.capabilities]
capabilities = ["fs.read", "fs.write"]

[marketplace]
visibility = "public"
price = "free"
publisher = "plexi"
