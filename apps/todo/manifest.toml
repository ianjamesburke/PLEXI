schema_version = 1

[app]
id = "todo"
type = "app"
name = "Todo"
version = "0.1.0"
description = "Simple todo list persisted to <workspace_root>/.plexi/todos.json."
entry = "todo.py"

[app.capabilities]
capabilities = ["fs.read", "fs.write"]

[launch]
# Opt into the "cwd" pane group: receives PathChanged when any linked terminal
# in the same group moves directories. Lets the todo list track the focused cwd.
join_group = "cwd"

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
