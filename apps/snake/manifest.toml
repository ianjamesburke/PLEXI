schema_version = 1

[app]
id = "snake"
type = "app"
name = "Snake"
version = "0.1.0"
description = "Classic snake game — proves input + draw primitives."
entry = "snake.py"

[app.capabilities]
capabilities = ["pipe.open", "timer"]

[runtime]
python_compat = true

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
