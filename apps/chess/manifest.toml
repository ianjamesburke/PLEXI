schema_version = 1

[app]
id = "chess"
type = "app"
name = "Chess"
version = "0.2.0"
description = "One chess game that people and agents play through the same domain operations: chess.* tools, revision-checked moves with receipts, and chess.move_committed events."
entry = "chess.py"

[runtime]
python_compat = true

[state]
scopes = ["context"]

[launch]
# One board per context unless the caller passes `app open --new`.
# A plain second open focuses the open board. `--new` spawns another
# instance, which `app call --pane` addresses.
on_launch = "focus_existing_in_context"

[app.capabilities]
capabilities = []

[marketplace]
visibility = "public"
price = "free"
publisher = "plexi"
