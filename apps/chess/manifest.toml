schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "chess.py"

[state]
scopes = ["context"]

[launch]
# One board per context. A second `app open chess` focuses that board
# instead of stacking a pane whose tools the host cannot address.
on_launch = "focus_existing_in_context"

[marketplace]
visibility = "public"
price = "free"
publisher = "plexi"

[plugin]
id = "chess"
name = "Chess"
version = "0.2.0"
description = "One chess game that people and agents play through the same domain operations: chess.* tools, revision-checked moves with receipts, and chess.move_committed events."

[plugin.capabilities]
capabilities = []

[[contributes.views]]
id = "chess.main"
default = true
