schema_version = 1

[app]
id = "logs"
type = "app"
name = "Logs"
version = "0.3.0"
description = "Live tail of the Plexi host log, color-coded by level, with level/app/search filters."
entry = "logs.py"
mouse_tracking = true

[app.capabilities]
capabilities = ["fs.read", "timer"]

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
