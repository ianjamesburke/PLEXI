schema_version = 1

[app]
id = "logs"
type = "app"
name = "Logs"
version = "0.3.0"
description = "Live tail of the Plexi host log, color-coded by level, with level/app/search filters."
entry = "logs.py"
mouse_tracking = true

[runtime]
python_compat = true

[app.capabilities]
capabilities = ["logs.read", "timer"]

[launch]
# One live tail of the host log per context — relaunching focuses the open
# Logs pane instead of stacking duplicates (reference example for #0336).
on_launch = "focus_existing_in_context"

[marketplace]
visibility = "public"
price = "free"
publisher = "plexi"
