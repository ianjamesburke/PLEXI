schema_version = 2

[launch]

# Uncomment and fill in to publish with `plexi plugin publish`:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "your-org"  # required: your publisher / org slug

[plugin]
id = "component-gallery"
name = "Component Gallery"
version = "0.1.0"
description = "Reference gallery rendering every host-rendered SDK primitive (stint 0328)"
watch = true

[plugin.capabilities]
capabilities = []

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "component-gallery.main"
default = true
