schema_version = 1

[app]
id = "cli-renderer"
type = "app"
name = "CLI Renderer"
version = "0.1.0"
description = "Auto-UI renderer for CLI tools opened with --cli"
entry = "cli_renderer.py"

[app.capabilities]
capabilities = ["terminal.bindings"]

[launch]
notification_scope = "context"
background = false
