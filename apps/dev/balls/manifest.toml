schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "balls.py"

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app

[plugin]
id = "balls"
name = "Balls"
version = "0.1.0"
description = "Physics simulation — elastic circle collisions demonstrating DrawCommand::Circle."

[plugin.capabilities]
capabilities = []

[[contributes.views]]
id = "balls.main"
default = true
