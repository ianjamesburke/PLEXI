schema_version = 2

[launch]

# Uncomment and fill in to publish with `plexi app publish`:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "your-org"  # required: your publisher / org slug

[plugin]
id = "text-input-probe"
name = "Text Input Probe"
version = "0.1.0"
description = "POC: HostHarness TextInput typing fixture (stint 0456) — a bare TextInput plus observer Text rows; a passing run proves focused-field typing, on_change round-trip, and Enter-submit end to end."
watch = true

[plugin.capabilities]
capabilities = []

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "text-input-probe.main"
default = true
