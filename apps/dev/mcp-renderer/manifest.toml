schema_version = 1

[app]
id = "mcp-renderer"
type = "app"
name = "MCP Renderer"
version = "0.1.0"
description = "Wraps any stdio MCP server as a navigable tool UI"
entry = "mcp_renderer.py"

[app.capabilities]
capabilities = ["terminal.bindings", "spawn.app"]

[launch]
notification_scope = "context"
background = false
