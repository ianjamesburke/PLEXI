schema_version = 2

[plugin]
id = "keymap-probe"
name = "KeyMap Probe"
version = "0.1.0"
description = "POC proving KeyMap shortcut helper receives events via both Event::Text (printable) and Event::Key (chords) paths."

[plugin.capabilities]
capabilities = []

[runtime]
kind = "python"
entry = "keymap_probe.py"

[[contributes.views]]
id = "keymap-probe.main"
default = true
