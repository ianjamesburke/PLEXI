schema_version = 2

[launch]

# Uncomment and fill in to publish with `plexi app publish`:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "your-org"  # required: your publisher / org slug

[plugin]
id = "node-click-probe"
name = "Node Click Probe"
version = "0.1.0"
description = "POC: HostHarness node-targeted click fixture (stint 0414) — a bare Button whose node_id (from `plexi pane state`) is the only input; a passing click proves the AppRequest::ClickPaneNode primitive end to end."
watch = true

[plugin.capabilities]
capabilities = []

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "node-click-probe.main"
default = true
