schema_version = 2

[launch]

[plugin]
id = "sudoku"
name = "Sudoku"
version = "0.1.0"
min_sdk_version = "0.1.13"
description = "Sudoku with easy, medium, and hard difficulties. Click or use arrow keys to select cells, type 1-9 to fill, N for notes mode."
watch = true

[plugin.capabilities]
capabilities = ["timer"]

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "sudoku.main"
default = true
