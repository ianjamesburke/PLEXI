schema_version = 2

[launch]

[plugin]
id = "coding-agent"
name = "Coding Agent"
version = "0.1.0"
description = "AI coding assistant focused on code review, debugging, and engineering best practices."

[plugin.capabilities]
capabilities = ["ai.query"]

[runtime]
kind = "python"
entry = "coding_agent.py"

[[contributes.views]]
id = "coding-agent.main"
default = true
