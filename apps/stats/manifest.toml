schema_version = 1

[app]
id = "stats"
type = "app"
name = "Stats"
version = "0.2.0"
description = "Activity dashboard: focus level, time, streak, top projects, and a 24h heatmap from Plexi focus events."
entry = "stats.py"

[app.capabilities]
capabilities = ["timer"]

[launch]

# Not published to the marketplace: reads PLEXI_SOCKET directly to locate the
# host events file, a native host-routing pattern the packager blocks. Keep
# [marketplace] absent until that read is host-mediated or the app moves to the
# sandboxed wasm container.
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
