schema_version = 1

[app]
id = "permissions"
type = "app"
name = "Permissions"
entry = "main.py"
version = "0.1.0"
description = "View and manage capability permissions for every app"
watch = true

[runtime]
python_compat = true

[app.capabilities]
capabilities = ["permissions.manage"]

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
