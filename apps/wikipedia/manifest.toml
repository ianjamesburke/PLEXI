schema_version = 1

[app]
id = "wikipedia"
type = "app"
name = "Wikipedia"
version = "0.1.0"
description = "Search Wikipedia and browse article summaries."
entry = "wikipedia.py"

[app.capabilities]
capabilities = ["net.http"]
allowed_hosts = ["en.wikipedia.org"]

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app
