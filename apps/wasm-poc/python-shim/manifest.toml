schema_version = 2

[launch]

[plugin]
id = "com.plexi.python-shim"
name = "Python Shim"
version = "0.1.0"
description = "CPython lifecycle shim boundary POC for SDK v3 JSON bridge."

[plugin.capabilities]
capabilities = []

[plugin.capabilities.wasm]
required = ["state:read-write"]
optional = []

[runtime]
kind = "wasm"
entry = "../../../target/wasm32-wasip1/release/python_shim.wasm"

[[contributes.views]]
id = "com.plexi.python-shim.main"
default = true
