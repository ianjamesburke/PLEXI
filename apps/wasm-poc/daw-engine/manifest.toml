schema_version = 2

[launch]

[plugin]
id = "com.plexi.daw-engine-poc"
name = "DAW Engine"
version = "0.1.0"
description = "DAW POC. Keyboard-complete timeline / mixer / transport UI (stint 0516) over the plexi-daw-model edit model, rendered in real time and offline through one shared render path (stint 0515)."

[plugin.capabilities]
capabilities = ["audio.playback", "fs.pick"]

[plugin.capabilities.wasm]
required = ["state:read-write"]
optional = []

[runtime]
kind = "wasm"
entry = "../../../target/wasm32-wasip1/release/daw_engine_poc.wasm"

[[contributes.views]]
id = "com.plexi.daw-engine-poc.main"
default = true
