[package]
name = "plexi-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Ian Burke"]
description = "Rust SDK for building Plexi external apps"
license = "MIT"
repository = "https://github.com/ianjamesburke/PLEXI"
homepage = "https://github.com/ianjamesburke/PLEXI"
documentation = "https://docs.rs/plexi-sdk"
readme = "README.md"
keywords = ["plexi", "terminal", "sdk", "tui", "app"]
categories = ["command-line-interface", "gui"]
exclude = ["target/*", "tests/fixtures/*"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
