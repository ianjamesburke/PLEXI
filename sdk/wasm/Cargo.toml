license = "MIT"
repository = "https://github.com/ianjamesburke/plexi"

[dependencies]
wit-bindgen = "0.41"

[package.metadata.component]
package = "plexi:app"

[package.metadata.component.target]
path = "wit"
world = "plexi-app"
