[project]
name = "plexi-e2e-authoring"
version = "0.1.0"
description = "Agent-drives-agent E2E runner for Plexi app-authoring sessions (stint 0331)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plexi-e2e = "plexi_e2e.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plexi_e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
