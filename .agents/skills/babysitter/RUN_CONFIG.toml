# Babysitter run configuration — single source for run-invariant settings.
# Read on invocation and re-read at every spawn. Values only; behavior/mechanics
# live in SKILL.md. Nothing below gets restated anywhere.

[engines]
policy = "codex-first"          # workers and testers; codex-first | claude-first
# Heads run Claude — mechanics exception, not preference: the head role requires
# ScheduleWakeup self-scheduling, which Codex has no equivalent for (see SKILL.md
# "Head liveness"). Dissolves when stint 0628 (host-owned job supervisor) lands.
head_engine = "claude"
head_tier = "medium"
worker_tier = "medium"           # small only for genuinely trivial mechanical batches
tester_tier = "medium"
merge_runner_tier = "small"      # clean-merge-only; see merge_runner_escalates_on
merge_runner_escalates_on = ["conflict", "checks-not-green", "not-mergeable", "disputed-fail"]

[authorization]
auto_merge = true                # standing pre-authorization; false forces per-merge approval

[reservations]
attended_only = ["0601", "0439"]  # never queued unattended

[hazards]
notes = "see .claude/skills/babysitter/SKILL.md Rules — no audible cue, no keychain security commands from agents, no sound/dialogs overnight"

[briefing]
style = "file-form, no slash commands for codex"

[cadence]
check_interval_seconds = 900        # failsafe heartbeat only, not the wait mechanism — see SKILL.md
wait_mode = "event-driven"
pane_event_poll_seconds = 10
codex_head_clock = "external-heartbeat"   # operator loop prompts 'cycle'; see SKILL.md "Head liveness"

[worker-postgate]
prewarm_release_build = false    # OFF 2026-07-31: OOMed the machine at ~10 concurrent lanes; needs a build lock first

[limits]
max_concurrent_lanes = 4
max_concurrent_cargo_builds = 1
on_cap = "pause"                 # pause new lanes over queueing more panes
