# babysitter-v3 run configuration — the single source for run-invariant settings.
# Values only; mechanics live in SKILL.md. Re-read at every spawn.

# Each role is an ordered fallback list of shell aliases (defined in the
# operator's zshrc). The head spawns with the first entry (or alternates to
# split usage across Codex and AGY); when a pane hits a usage limit or a hard
# problem, it uses `col` (Codex GPT-6 Astra).
# `col` (GPT-6 Astra) is available and preferred for hard problems, `worker_large`,
# follow-up rounds, and cross-vendor testing/load-splitting alongside `agy`.
[roles]
head          = ["agy", "col", "cm", "agym"]        # router; needs background tasks + wake
worker        = ["col", "agy", "com", "agym"]       # split usage across Codex (col = GPT-6 Astra) and AGY
worker_large  = ["col", "agy", "cl", "agyl"]        # batches containing an L stint, hard problems, or after a reject -> col (GPT-6 Astra) first
tester        = ["col", "agy", "com", "cs", "agym"] # cross-vendor: use col (GPT-6 Astra) when worker was agy, or agy when worker was col/com

# How each engine takes an initial prompt on its command line. {alias} and
# {prompt} are substituted; {prompt} is always single-quoted by the head.
[engines.launch]
claude = "{alias} {prompt}"
codex  = "{alias} {prompt}"
agy    = "{alias} -i {prompt}"

# Map alias prefix -> engine. Longest prefix wins.
[engines.alias_engine]
c   = "claude"
co  = "codex"
agy = "agy"

# Footer text that means the agent is mid-turn. Absence on the last buffer lines
# (with a prompt visible) means idle. `plexi pane status` does not recognise agy,
# so the head uses these for every engine.
[engines.working_footer]
claude = "esc to interrupt"
codex  = "esc to interrupt"
agy    = "esc to cancel"

# Case-insensitive patterns in a pane capture that mean a usage/quota wall.
[engines.usage_limit_patterns]
all = ["usage limit", "limit reached", "rate limit", "quota", "resets at", "try again later"]

[authorization]
auto_merge = true                 # tester PASS + green PR checks -> merge without asking

[reservations]
attended_only = ["0601", "0439"]  # never queued unattended

[limits]
max_concurrent_lanes = 3          # cargo builds are serialized by cargo-with-lease.sh; >3 lanes just queues on it
max_fix_rounds = 2                # after this many tester FAILs on one batch, park it
stall_minutes = 25                # idle footer + no terminal slot this long -> inspect

[cadence]
heartbeat_seconds = 900           # failsafe wake when no slot event arrives

[paths]
run_root = ".stint/runs"          # git-ignored; each run gets <run_root>/<YYYYMMDD-HHMM>/
