schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "main.py"

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app

[plugin]
id = "github-issues"
name = "GitHub Issues"
version = "0.1.0"
description = "GitHub Issues viewer for the workspace repo."

[plugin.capabilities]
capabilities = ["net.http"]
allowed_hosts = ["api.github.com"]

[[contributes.views]]
id = "github-issues.main"
default = true
