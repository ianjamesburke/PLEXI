schema_version = 2

[launch]

[plugin]
id = "research-agent"
name = "Research Agent"
version = "0.1.0"
description = "AI research assistant that summarizes topics, cites sources, and helps structure findings."

[plugin.capabilities]
capabilities = ["ai.query"]

[runtime]
kind = "python"
entry = "research_agent.py"

[[contributes.views]]
id = "research-agent.main"
default = true
