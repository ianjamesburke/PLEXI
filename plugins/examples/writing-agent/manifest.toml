schema_version = 2

[launch]

[plugin]
id = "writing-agent"
name = "Writing Agent"
version = "0.1.0"
description = "AI writing editor that improves clarity, tone, and structure in your writing."

[plugin.capabilities]
capabilities = ["ai.query"]

[runtime]
kind = "python"
entry = "writing_agent.py"

[[contributes.views]]
id = "writing-agent.main"
default = true
