schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "wikipedia.py"

[launch]

[marketplace]
visibility = "public"
price = "free"
publisher = "plexi"

[plugin]
id = "wikipedia"
name = "Wikipedia"
version = "0.4.0"
description = "Search Wikipedia and browse article summaries."

[plugin.capabilities]
capabilities = ["net.http"]
allowed_hosts = ["en.wikipedia.org"]

[[contributes.views]]
id = "wikipedia.main"
default = true
