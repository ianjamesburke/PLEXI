schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "tetris.py"

[launch]

# Uncomment to publish this app to the marketplace:
# [marketplace]
# visibility = "public"   # public | unlisted | private
# price = "free"          # "free", or a price like "4.99"
# publisher = "plexi"     # first-party Plexi app

[plugin]
id = "tetris"
name = "Tetris"
version = "0.1.0"
description = "Classic Tetris driven by the continuous WASM frame clock."

[plugin.capabilities]
capabilities = []

[[contributes.views]]
id = "tetris.main"
default = true
