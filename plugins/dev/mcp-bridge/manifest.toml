schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "mcp_bridge.py"

[launch]

[plugin]
id = "mcp-bridge"
name = "MCP Bridge"
version = "0.1.0"
description = "Bridges configured MCP servers onto the Plexi connector tool plane"

[plugin.capabilities]
capabilities = ["mcp.client"]

[[contributes.views]]
id = "mcp-bridge.main"
default = true
