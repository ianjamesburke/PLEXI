schema_version = 2

[launch]

[plugin]
id = "mcp-hidden-probe"
name = "MCP Hidden Probe"
version = "0.1.0"
description = "POC: HostHarness MCP fixture (stint 0382 fix round) — connects to the configured 'probe' server, sends one request, and reports each phase via set_title so a hidden-window (logic-only) harness test can observe MCP delivery without a paint pass."

[plugin.capabilities]
capabilities = ["mcp.client"]

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "mcp-hidden-probe.main"
default = true
