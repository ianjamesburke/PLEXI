schema_version = 2

[launch]

[plugin]
id = "key-event-probe"
name = "Key Event Probe"
version = "0.1.0"
description = "POC: HostHarness KeyPane fixture (stint 0426) — a `+`/`-`/`r` keyboard-only counter; a passing `plexi pane key` proves KeyEvent dispatch reaches a WASM Python pane end to end."

[plugin.capabilities]
capabilities = []

[runtime]
kind = "python"
entry = "main.py"

[[contributes.views]]
id = "key-event-probe.main"
default = true
