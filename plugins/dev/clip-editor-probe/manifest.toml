schema_version = 2

[runtime]
python_compat = true
kind = "python"
entry = "main.py"

[state]
scopes = ["context"]

[launch]

[plugin]
id = "clip-editor-probe"
name = "Clip Editor Probe"
version = "0.1.0"
description = "Deterministic editor-like fixture for clip inspection, revision-checked mutations, and clip events"

[plugin.capabilities]
capabilities = []

[[contributes.views]]
id = "clip-editor-probe.main"
default = true
