schema_version = 2

[launch]

[plugin]
id = "com.plexi.audio-synth"
name = "Synth"
version = "0.1.0"
description = "Additive sine oscillator. RT audio POC proving audio output and Plexi Pipes waveform streaming."

[plugin.capabilities]
capabilities = ["audio.playback", "pipe.open"]

[plugin.capabilities.wasm]
required = ["state:read-write"]
optional = []

[runtime]
kind = "wasm"
entry = "../../../target/wasm32-wasip1/release/audio_synth.wasm"

[[contributes.views]]
id = "com.plexi.audio-synth.main"
default = true
