schema_version = 2

[launch]

[plugin]
id = "com.plexi.sysmon"
name = "System Monitor"
version = "0.1.0"
description = "CPU, memory, disk, and network stats POC for the Plexi WASM runtime."

[plugin.capabilities]
capabilities = []

[plugin.capabilities.wasm]
required = ["state:read-write"]
optional = []

[runtime]
kind = "wasm"
entry = "../../../target/wasm32-wasip1/release/sysmon.wasm"

[[contributes.views]]
id = "com.plexi.sysmon.main"
default = true
