schema_version = 2

[launch]

[plugin]
id = "com.plexi.jukebox"
name = "Jukebox"
version = "0.1.0"
description = "Agent-drivable audio library POC. Picks audio files, decodes WAV in-guest, plays through the host audio stream, and exposes jukebox.* transport tools to the assistant."

[plugin.capabilities]
capabilities = ["audio.playback", "fs.pick"]

[plugin.capabilities.wasm]
required = []
optional = []

[runtime]
kind = "wasm"
entry = "../../../target/wasm32-wasip1/release/jukebox.wasm"

[[contributes.views]]
id = "com.plexi.jukebox.main"
default = true
