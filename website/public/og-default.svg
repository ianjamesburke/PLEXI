  <rect x="600" y="102" width="130" height="120" rx="5" fill="none" stroke="#e4e4e7" stroke-width="5"/>
  <rect x="600" y="242" width="130" height="120" rx="5" fill="#9333ea"/>

  <text x="600" y="462" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="72" font-weight="600" fill="#e4e4e7" letter-spacing="-2">plexi</text>

  <text x="600" y="510" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="28" font-weight="400" fill="#a1a1aa" letter-spacing="-0.5">The last app you'll ever need.</text>
