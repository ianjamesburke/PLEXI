# Cmd+Enter toggles zoom both ways; Cmd+W cancels a modal before reaching the pane.
size = [1168.0, 720.0]

[[steps]]
open = { kind = "builtin", id = "file_browser", cwd = "tests", as = "files" }
[[steps]]
open = { kind = "builtin", id = "file_browser", cwd = "tests/scenes", as = "second" }
[[steps]]
focus = "second"
[[steps]]
key = { target = "host", value = "cmd+enter" }
[[steps]]
key = { target = "host", value = "cmd+enter" }
[[steps]]
assert = { target = "second", exists = true, pane_count = 2 }
[[steps]]
key = { target = "host", value = "cmd+p" }
[[steps]]
key = { target = "host", value = "cmd+w" }
[[steps]]
assert = { target = "second", exists = true, pane_count = 2 }
[[steps]]
shot = "pane-close-zoom.png"
