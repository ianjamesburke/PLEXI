# File-picker round trip (stint 0508): the POC app runs save-pick -> write ->
# open-pick -> read -> cancelled-pick against the scripted picker backend, all
# through picker-granted absolute paths outside the workspace jail.
# In scene_suite since stint 1455. It was `suite = false` when apps ran as a
# separate CPython process; they now run as CPython-in-WASM inside the host.
# Since sensitive capabilities need a human grant, the scene grants `fs.write`
# (headless only).

picker_script = [
  { paths = ["{out}/roundtrip.txt"] }, # save-1
  { paths = ["{out}/roundtrip.txt"] }, # open-1
  { cancel = true },                   # cancel-1
]

[[steps]]
open = { kind = "process", path = "plugins/dev/file-picker-poc", as = "picker", args = ["--auto"], grants = ["fs.write"] }

[[steps]]

# The auto flow finishes with a pick the script cancels; by the time the
# cancel lands, the write -> read round trip has already completed.
wait_view_frame = { target = "picker", timeout_s = 30.0 }
[[steps]]
expect = { target = "picker", tree_contains = "status: cancelled:cancel-1", timeout_s = 20.0 }

[[steps]]
expect = { target = "picker", tree_contains = "content: hello from the picker round trip", timeout_s = 5.0 }

[[steps]]
shot = "file-picker.png"
