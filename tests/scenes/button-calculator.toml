# Shared kit buttons in the Calculator plugin, in both built-in themes.
size = [1000.0, 700.0]
themes = ["plexi-dusk", "plexi-dawn"]
suite = false

[[steps]]
open = { kind = "process", path = "plugins/calc", as = "calc" }

[[steps]]
wait_view_frame = { target = "calc", timeout_s = 30.0 }

[[steps]]
assert = { target = "calc", lifecycle = "running", tree_contains = "0" }

[[steps]]
shot = "button-calculator.png"
