# Cmd+N has the same core page/window contract when the optional minimap is on.
size = [1280.0, 800.0]
experiments = ["page_grid"]

[[steps]]
open = { kind = "builtin", id = "assistant", as = "initial" }

[[steps]]
assert = { pane_count = 1, window_count = 1 }

[[steps]]
key = { target = "host", value = "cmd+n" }

[[steps]]
assert = { pane_count = 1, window_count = 2 }

[[steps]]
shot = "new-pane-page-grid.png"
