# Cmd+Escape follows context ancestry and leaves root panes visible.
macos_only = true
sizes = [[1280.0, 800.0], [720.0, 600.0]]

[[steps]]
open = { kind = "builtin", id = "text-editor", as = "plan", args = ["{tmp}/plan.md"] }
[[steps]]
paste = { target = "plan", value = "# Context navigation\n\nCmd+Escape returns to the parent context.\nAt the root, these panes stay visible.\n" }
[[steps]]
key = { target = "plan", value = "cmd+s" }
[[steps]]
open = { kind = "builtin", id = "text-editor", as = "overview", args = ["{tmp}/overview.md"] }
[[steps]]
paste = { target = "overview", value = "# Root overview\n\nThis note stays at the root.\nCmd+Escape stops here.\n" }
[[steps]]
key = { target = "overview", value = "cmd+s" }
[[steps]]
focus = "plan"
[[steps]]
push_to_subcontext = "Work"
[[steps]]
assert = { pane_count = 1, context_count = 2 }
[[steps]]
open = { kind = "builtin", id = "text-editor", as = "work", args = ["{tmp}/work.md"] }
[[steps]]
paste = { target = "work", value = "# Working context\n\nThe detail lives one level below.\nCmd+Escape returns here first.\n" }
[[steps]]
key = { target = "work", value = "cmd+s" }
[[steps]]
focus = "plan"
[[steps]]
push_to_subcontext = "Detail"
[[steps]]
assert = { pane_count = 1, context_count = 3 }
[[steps]]
key = { target = "host", value = "cmd+escape" }
[[steps]]
assert = { pane_count = 2, context_count = 3 }
[[steps]]
shot = "context-parent.png"
[[steps]]
key = { target = "host", value = "cmd+escape" }
[[steps]]
assert = { pane_count = 2, context_count = 3 }
[[steps]]
shot = "context-root.png"
[[steps]]
key = { target = "host", value = "cmd+escape" }
[[steps]]
assert = { pane_count = 2, context_count = 3 }
[[steps]]
shot = "context-root-stays.png"
[[steps]]
key = { target = "host", value = "cmd+/" }
[[steps]]
assert_label = { target = "host", label = "Go to parent context" }
[[steps]]
shot = "context-shortcuts.png"
