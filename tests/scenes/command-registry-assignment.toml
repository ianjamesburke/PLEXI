size = [1168.0, 720.0]

[[steps]]
open = { kind = "builtin", id = "file_browser", cwd = "tests/fixtures/file-browser-tree", as = "files" }

[[steps]]
key = { target = "host", value = "cmd+p" }

[[steps]]
text = { target = "host", value = "changelog" }

[[steps]]
run_steps = 3

[[steps]]
key = { target = "host", value = "cmd+enter" }

[[steps]]
assert_label = { target = "host", label = "Assign shortcut in config" }

[[steps]]
shot = "command-assignment-action.png"

[[steps]]
text = { target = "host", value = "assign shortcut" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
run_steps = 3

[[steps]]
assert_label = { target = "host", label = "Set open_changelog under [keybindings] to the chord you want." }

[[steps]]
shot = "command-assignment-config.png"
