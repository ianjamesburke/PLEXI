# Spatial minimap overlay in every core Plexi theme.
size = [1280.0, 800.0]
themes = ["plexi-night", "plexi-dusk", "plexi-dawn", "plexi-day"]

[[steps]]
open = { kind = "builtin", id = "assistant", as = "initial" }

[[steps]]
assert = { pane_count = 1, window_count = 1 }

[[steps]]
key = { target = "host", value = "cmd+shift+m" }

[[steps]]
shot = "minimap-core.png"

[[steps]]
key = { target = "host", value = "cmd+shift+m" }

[[steps]]
assert = { pane_count = 1, window_count = 1 }
