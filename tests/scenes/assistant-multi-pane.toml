# Shared native multi-pane contract. This exact scene runs headlessly and
# through `just scene-live` against an installed channel.
size = [1280.0, 800.0]

[[steps]]
open = { kind = "builtin", id = "file_browser", cwd = ".", as = "files" }

[[steps]]
open = { kind = "builtin", id = "assistant", as = "assistant" }

[[steps]]
run_steps = 3

# Stint 0424: the header bar (which used to carry this "Assistant" label) was
# removed — the transcript now starts at the top of the pane.
[[steps]]
assert = { target = "assistant", exists = true, focused = true, pane_count = 2 }

[[steps]]
text = { target = "assistant", value = "/settings" }

[[steps]]
key = { target = "assistant", value = "enter" }

[[steps]]
run_steps = 3

[[steps]]
assert_label = { target = "assistant", label = "Assistant settings" }
