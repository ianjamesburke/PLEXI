# Medium-width Bluesky PGAP smoke test with fixture state. This catches the
# overlap case where trailing stats are visible but the pane is too narrow for
# unbounded primary/secondary text. suite = false because it spawns a real child
# process; run with `just scene tests/scenes/bluesky-medium-font-smoke.toml`.
size = [650.0, 700.0]
suite = false

[[steps]]
open_app = "apps/dev/bluesky"
args = ["--fixture", "state.json"]

[[steps]]
wait_app_frame = { timeout_s = 15.0 }

[[steps]]
run_steps = 5

[[steps]]
assert = { pane_count = 1, lifecycle = "running", tree_contains = "Bluesky" }

[[steps]]
shot = "bluesky-medium-font-smoke.png"
