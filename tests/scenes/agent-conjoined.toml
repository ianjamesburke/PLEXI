size = [1280.0, 800.0]

[[steps]]
agent_children = "seed"

[[steps]]
assert_label = { target = "host", label = "implementer · working" }

[[steps]]
key = { target = "host", value = "cmd+down" }

[[steps]]
shot = "agent-conjoined.png"

# Dive unfolds a flap over the parent. The parent stays the active window
# (one pane, no portal). The flap header is the proof the children opened.
[[steps]]
assert = { pane_count = 1, context_count = 2, portal_count = 0 }

[[steps]]
assert_label = { target = "host", label = "Back to lead" }

[[steps]]
agent_children = "complete"

[[steps]]
assert = { pane_count = 1, context_count = 1 }
