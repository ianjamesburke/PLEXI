# A real CPython-in-WASM app past its first frame: every later frame arrives as
# a `tree_delta` the decoder reconstructs. Launching the ball changes the tree,
# so the change is only observable if delta frames apply and paint.
size = [900.0, 700.0]

[[steps]]
open = { kind = "process", path = "apps/breakout", as = "breakout" }

[[steps]]
wait_view_frame = { target = "breakout", timeout_s = 30.0 }

[[steps]]
expect = { target = "breakout", after_key = "space", node_changes = "Breakout", timeout_s = 5.0 }

[[steps]]
run_steps = 30

[[steps]]
assert = { target = "breakout", lifecycle = "running", tree_contains = "Breakout" }

[[steps]]
shot = "breakout-delta-frames.png"
