size = [1000.0, 700.0]

[[steps]]
open = { kind = "builtin", id = "file_browser", as = "files" }

[[steps]]
key = { target = "host", value = "cmd+shift+s" }

[[steps]]
assert_label = { target = "host", label = "Secrets" }

[[steps]]
key = { target = "host", value = "a" }

[[steps]]
assert_label = { target = "host", label = "New Secret" }

[[steps]]
assert_label = { target = "host", label = "Value (hidden)" }

[[steps]]
text = { target = "host", value = "SCENE_0858_KEY" }

[[steps]]
key = { target = "host", value = "tab" }

[[steps]]
text = { target = "host", value = "scene-canary-value" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
assert_label = { target = "host", label = "SCENE_0858_KEY" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
assert_label = { target = "host", label = "Edit Secret" }

[[steps]]
text = { target = "host", value = "scene-canary-replacement" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
key = { target = "host", value = "d" }

[[steps]]
key = { target = "host", value = "escape" }

[[steps]]
assert_label = { target = "host", label = "SCENE_0858_KEY" }

[[steps]]
key = { target = "host", value = "d" }

[[steps]]
key = { target = "host", value = "y" }


[[steps]]
key = { target = "host", value = "cmd+shift+s" }

[[steps]]
key = { target = "host", value = "cmd+p" }

[[steps]]
text = { target = "host", value = "Open Secrets" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
assert_label = { target = "host", label = "Secrets" }

[[steps]]
shot = "secrets-manager.png"
