# Exercise the actual Notes surface; inspect the end caret and bottom space.
sizes = [[480.0, 320.0], [960.0, 640.0]]

[[steps]]
open = { kind = "builtin", id = "text-editor", as = "notes", args = ["{tmp}/note.md"] }

[[steps]]
focus = "notes"

[[steps]]
key = { target = "notes", value = "cmd+a" }

[[steps]]
paste = { target = "notes", value = "# Editor field notes\n\nScrolling should remain steady while reading. A long paragraph wraps naturally when the pane is narrow, and the caret stays reachable when the available space changes.\n\n## Things to check\n\n- Read a note without being pulled back to the caret.\n- Move down through wrapped paragraphs using the keyboard.\n- Enter and leave full screen while writing.\n- Keep some empty space below the final line.\n\nThe document uses one source of truth for text, selections, and undo. Layout translates source positions into display rows, and scrolling should reuse that geometry until the document or its width changes.\n\nUnicode remains editable: café, 日本語, and 👨‍👩‍👧. Links remain readable: [Plexi](https://plexiapp.com).\n\nFinal line: room to keep writing." }

[[steps]]
key = { target = "notes", value = "cmd+down" }

[[steps]]
expect = { target = "notes", focused = true, source_text_contains = "Final line: room to keep writing." }

[[steps]]
shot = "notes-scroll-end.png"

[[steps]]
key = { target = "notes", value = "pageup" }

[[steps]]
key = { target = "notes", value = "cmd+down" }

[[steps]]
text = { target = "notes", value = " More thoughts." }

[[steps]]
expect = { target = "notes", focused = true, source_text_contains = "Final line: room to keep writing. More thoughts." }

[[steps]]
shot = "notes-scroll-after-navigation.png"

[[steps]]
close = "notes"
