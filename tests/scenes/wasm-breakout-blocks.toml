# Breakout benchmark with a custom block count — opens the WASM GPU surface
# POC with `--blocks 96` (snaps to 12 rows x 8 cols) and captures the result.
# Run with: `just scene tests/scenes/wasm-breakout-blocks.toml`.
size = [1100.0, 760.0]
suite = true

[[steps]]
open_wasm = "tests/wasm-fixtures/breakout.wasm"
args = ["--blocks", "96"]

[[steps]]
run_steps = 4

[[steps]]
assert = { pane_count = 1, lifecycle = "running", tree_contains = "Bricks 96" }

[[steps]]
shot = "wasm-breakout-blocks.png"
