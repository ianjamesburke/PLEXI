# Exercise the picker filter with an isolated quick-captured note.
sizes = [[420.0, 640.0], [900.0, 640.0]]
scales = [1.0, 1.5]

[[steps]]
key = { target = "host", value = "cmd+0" }

[[steps]]
text = { target = "host", value = "Project planning note" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
key = { target = "host", value = "cmd+o" }

[[steps]]
wait_notes_index = 5.0

[[steps]]
assert = { layout_valid = true, layout_surfaces = ["scope_switcher"] }

[[steps]]
assert_label = { target = "host", label = "All notes" }

[[steps]]
shot = "notes-picker-all-notes.png"

[[steps]]
key = { target = "host", value = "tab" }

[[steps]]
assert_label = { target = "host", label = "Current project" }

[[steps]]
assert_label = { target = "host", label = "Project planning note" }

[[steps]]
assert = { layout_valid = true, layout_surfaces = ["scope_switcher"] }

[[steps]]
shot = "notes-picker-project-filter.png"

[[steps]]
key = { target = "host", value = "tab" }

[[steps]]
assert_label = { target = "host", label = "Project planning note" }
