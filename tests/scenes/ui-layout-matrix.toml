# Headless scene: quick capture seeds the isolated notes tier. The test build
# injects fake Trash, so no real system Trash is touched.
sizes = [[520.0, 800.0], [1280.0, 800.0]]
scales = [0.6, 0.8, 1.0, 1.3, 1.6, 2.0]
themes = ["plexi-dusk", "plexi-dawn"]
reduced_motion = [false, true]

[[steps]]
key = { target = "host", value = "cmd+0" }

[[steps]]
text = { target = "host", value = "Release planning 👩🏽‍💻 é /unbroken/long/path/identifier-abcdef0123456789-abcdef0123456789-abcdef0123456789" }

[[steps]]
key = { target = "host", value = "enter" }

[[steps]]
run_steps = 4

[[steps]]
key = { target = "host", value = "cmd+o" }

[[steps]]
run_steps = 5

[[steps]]
assert_label = { target = "host", label = "Release planning 👩🏽‍💻 é /unbroken/long/path/identifier-abcdef0123456789-abcdef0123456789-abcdef0123456789" }

[[steps]]
key = { target = "host", value = "cmd+backspace" }

[[steps]]
run_steps = 2

[[steps]]
assert_label = { target = "host", label = "Undo" }

[[steps]]
assert = { layout_valid = true, layout_surfaces = ["titlebar", "toast"] }

[[steps]]
shot = "layout-toast.png"

[[steps]]
key = { target = "host", value = "cmd+z" }

[[steps]]
run_steps = 2

[[steps]]
assert_label = { target = "host", label = "Release planning 👩🏽‍💻 é /unbroken/long/path/identifier-abcdef0123456789-abcdef0123456789-abcdef0123456789" }
