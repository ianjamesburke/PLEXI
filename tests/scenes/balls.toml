# CPython-in-WASM Balls app through the production launch path.
size = [1280.0, 800.0]
suite = true

[[steps]]
open = { kind = "process", path = "apps/balls", as = "balls" }

[[steps]]
wait_app_frame = { target = "balls", timeout_s = 15.0 }

[[steps]]
run_steps = 5

[[steps]]
assert = { target = "balls", pane_count = 1, lifecycle = "running", tree_contains = "balls", fit = "fill" }

[[steps]]
shot = "balls.png"
