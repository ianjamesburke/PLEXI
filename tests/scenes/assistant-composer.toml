# Native Assistant composer-to-transcript wiring. The slash command stays
# deterministic while exercising the same submit/effect/render path as turns.
size = [1280.0, 800.0]

[[steps]]
open = { kind = "builtin", id = "assistant", as = "assistant" }

[[steps]]
run_steps = 2

[[steps]]
text = { target = "assistant", value = "/help" }

[[steps]]
key = { target = "assistant", value = "enter" }

[[steps]]
run_steps = 3

[[steps]]
assert_label = { target = "assistant", label = "/export" }

[[steps]]
shot = "assistant-composer.png"
