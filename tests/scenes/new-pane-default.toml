# Cmd+N keeps its established new-window contract with all experiments off.
size = [1280.0, 800.0]

[[steps]]
open = { kind = "builtin", id = "assistant", as = "initial" }

[[steps]]
assert = { pane_count = 1, window_count = 1 }

[[steps]]
key = { target = "host", value = "cmd+n" }

[[steps]]
assert = { pane_count = 1, window_count = 2 }

[[steps]]
shot = "new-pane-default.png"
