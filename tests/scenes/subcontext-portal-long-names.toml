# Two adjacent Portal tiles whose subcontexts have long names (stints 1166,
# 1338): each tile paints the standard pane header with an elided title over a
# minimap-only body, and no text crosses into the neighbouring tile.
sizes = [[640.0, 360.0], [1280.0, 800.0]]

[[steps]]
sidebar = false
[[steps]]
open = { kind = "builtin", id = "file_browser", as = "first" }
[[steps]]
open = { kind = "builtin", id = "file_browser", as = "second" }
[[steps]]
open = { kind = "builtin", id = "file_browser", as = "spare" }
[[steps]]
focus = "first"
[[steps]]
push_to_subcontext = "Investigate Plexi approval routing across nested agent contexts | PLEXI"
[[steps]]
focus = "second"
[[steps]]
push_to_subcontext = "Refactor workspace persistence so subcontext previews survive restarts"
[[steps]]
run_steps = 3
[[steps]]
assert = { context_count = 3, portal_count = 2, sidebar = false }
[[steps]]
shot = "subcontext-portal-long-names.png"
