# Chess Opponent — bundled agent definition.
# Installed to ~/.plexi-<channel>/agents/chess-opponent/ by scripts/install.sh.
#
# This file REQUESTS behavior. The permission broker stores what the user
# actually grants:
#   - `allow` tools work without a grant (actor-posture allow tier).
#   - `ask` tools and ALL event subscriptions need a user grant record
#     (grants.toml) before the agent can use them.

[agent]
id = "chess-opponent"
display_name = "Chess Opponent"
default_tier = "medium"

[permissions]
default_posture = "review"

allow = [
  "app.chess.state",
  "app.chess.legal_moves",
]

ask = [
  "app.chess.play",
]

[[subscriptions]]
app = "chess"
events = ["chess.game_started", "chess.move_committed"]
payload = "full"
trigger = "conversation"
default = "ask"
