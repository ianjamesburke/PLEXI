name: check CLI docs

on:
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/lib.rs'
      - 'src/cli/args.rs'
      - 'tools/gen_cli_docs/**'
      - 'justfile'
      - 'scripts/cargo-with-lease.sh'
      - 'website/src/content/docs/cli.md'
  pull_request:
    branches: [alpha]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/lib.rs'
      - 'src/cli/args.rs'
      - 'tools/gen_cli_docs/**'
      - 'justfile'
      - 'scripts/cargo-with-lease.sh'
      - 'website/src/content/docs/cli.md'

jobs:
  check-cli-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Plexi CI environment
        uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: cli-docs
          just: 'true'

      - name: Check CLI docs are up to date
        run: just check-cli-docs
