name: Package installation gates
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      PLEXI_ALPHA_SIGNING_P12_BASE64:
        required: false
      PLEXI_ALPHA_SIGNING_P12_PASSWORD:
        required: false
      PLEXI_ALPHA_SIGNING_CERT_SHA1:
        required: false
  pull_request:
    paths:
      - 'crates/distribution/**'
      - 'src/**'
      - 'scripts/*install*'
      - 'scripts/*package*'
      - 'scripts/test-distribution.py'
      - 'scripts/*signing*'
      - 'scripts/test-macos-keychain-continuity.py'
      - 'Cargo.*'
      - 'build.rs'
      - 'install.sh'
      - '.github/workflows/distribution.yml'
      - '.github/workflows/release.yml'

jobs:
  package:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # Apple Silicon only (v1 ruling) for alpha tags, PRs and alpha pushes. Other
      # platforms run only for stable/beta release tags, where `tag` is set and not alpha.
      matrix: ${{ fromJSON(inputs.tag != '' && !contains(inputs.tag, '-alpha.') && '{"include":[{"os":"macos-14","platform":"macos-arm64","optional":false},{"os":"ubuntu-22.04","platform":"linux-x64","optional":false},{"os":"windows-latest","platform":"windows-x64","optional":false},{"os":"macos-15-intel","platform":"macos-x64","optional":true}]}' || '{"include":[{"os":"macos-14","platform":"macos-arm64","optional":false}]}') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    env:
      PLEXI_BUILD_TAG: ${{ inputs.tag }}
      PLEXI_CPYTHON_BUNDLE_DIR: ${{ github.workspace }}/target/distribution-runtime
      PLEXI_SDK_PATH: ${{ github.workspace }}/sdk/python
      PLEXI_SCENE_TIMEOUT_SCALE: '4'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: distribution-${{ matrix.platform }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Import the persistent public macOS signing identity
        if: runner.os == 'macOS' && inputs.tag != ''
        timeout-minutes: 2
        env:
          PLEXI_ALPHA_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
          PLEXI_ALPHA_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
          PLEXI_ALPHA_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
        shell: bash
        run: |
          case '${{ inputs.tag }}' in
            *-alpha.*) bash scripts/setup-alpha-release-signing.sh ;;
            *) echo 'error: public beta/stable macOS releases require Developer ID signing and notarization; this Alpha-only identity may not be used' >&2; exit 1 ;;
          esac
      - name: Fetch the verified package runtime
        shell: bash
        run: uv run --no-project python -c 'from pathlib import Path; from scripts.package import runtime; runtime(Path("target/distribution-runtime"))'
      - name: Test and build the native installer
        shell: bash
        run: |
          cargo test -p plexi-distribution
          cargo clippy -p plexi-distribution --all-targets -- -D warnings
          RUSTFLAGS="-D warnings" cargo build --release -p plexi-distribution --bin plexi-installer
      - name: Exercise the native transaction and bootstrap
        shell: bash
        run: |
          suffix=''; [[ '${{ runner.os }}' != Windows ]] || suffix=.exe
          uv run --no-project python scripts/test-distribution.py --installer "target/release/plexi-installer$suffix" --platform '${{ matrix.platform }}'
      # Release tags only: on PRs and alpha pushes the Rust host workflow already
      # runs this exact test + clippy, so repeating it here just doubles the wait.
      - name: Test and lint the host
        if: inputs.tag != ''
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == Windows ]]; then
            # The owner branch supplies this native regression because the host
            # bin test target contains Unix-only socket/permission fixtures.
            cargo test --test windows_host_launch
          else
            # Phone seal tests shell out to phone_crypto.py, which imports
            # cryptography. The relay process itself does not.
            PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --user -r services/relay/requirements-phone-crypto.txt
            cargo test --bin plexi
          fi
          cargo clippy --bin plexi -- -D warnings
      - name: Build the release host
        shell: bash
        run: |
          RUSTFLAGS="-D warnings" cargo build --release --bin plexi
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb xauth
      - name: Assemble and exercise supported consumer channels
        env:
          PACKAGE_CHANNELS: ${{ (inputs.tag != '' && !contains(inputs.tag, '-alpha.')) && 'stable beta alpha' || 'alpha' }}
        shell: bash
        run: |
          set -euo pipefail
          suffix=''; [[ '${{ runner.os }}' != Windows ]] || suffix=.exe
          signing_args=()
          if [[ '${{ runner.os }}' == macOS && '${{ inputs.tag }}' != '' ]]; then
            signing_args=(--require-macos-signing --macos-signing-authority 'Plexi Dev' --macos-signing-certificate-sha1 "$PLEXI_SIGNING_CERT_SHA1")
          fi
          for channel in $PACKAGE_CHANNELS; do
            uv run --no-project python scripts/package.py --binary "target/release/plexi$suffix" --installer "target/release/plexi-installer$suffix" --platform '${{ matrix.platform }}' --channel "$channel" --output dist "${signing_args[@]}"
            command=(uv run --no-project python scripts/test-package.py --package "dist/package-${{ matrix.platform }}-$channel" --output "evidence/$channel" --gui)
            if [[ '${{ runner.os }}' == Linux ]]; then xvfb-run -a "${command[@]}"; else "${command[@]}"; fi
            if [[ '${{ runner.os }}' == macOS && '${{ inputs.tag }}' != '' ]]; then
              uv run --no-project python scripts/test-macos-signing.py --archive "dist/plexi-${{ matrix.platform }}${channel:+-$channel}.tar.gz" --expected-authority 'Plexi Dev' --expected-certificate-sha1 "$PLEXI_SIGNING_CERT_SHA1"
            fi
          done
          if [[ '${{ runner.os }}' == macOS && '${{ inputs.tag }}' == *-alpha.* ]]; then
            # Change compiled build identity so B has a different code hash.
            # Packaging identical bytes twice would not test an actual upgrade.
            PLEXI_BUILD_TAG="${PLEXI_BUILD_TAG}-continuity-b" RUSTFLAGS="-D warnings" cargo build --release --bin plexi
            uv run --no-project python scripts/package.py --binary "target/release/plexi" --installer "target/release/plexi-installer" --platform '${{ matrix.platform }}' --channel alpha --output continuity-b "${signing_args[@]}"
            uv run --no-project python scripts/test-macos-keychain-continuity.py --package-a "dist/package-${{ matrix.platform }}-alpha" --package-b "continuity-b/package-${{ matrix.platform }}-alpha"
          fi
          cp "target/release/plexi-installer$suffix" "dist/plexi-installer-${{ matrix.platform }}$suffix"
          uv run --no-project python -c 'from pathlib import Path; from scripts.package import digest; [p.with_name(p.name+".sha256").write_text(digest(p)+"  "+p.name+"\n") for p in Path("dist").glob("plexi-installer-*") if not p.name.endswith(".sha256")]'
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS' && inputs.tag != ''
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/plexi-alpha-release-signing.keychain-db"
          certificate="$RUNNER_TEMP/plexi-alpha-release-signing.pem"
          if [[ -f "$certificate.trusted" ]]; then sudo -n security remove-trusted-cert -d "$certificate"; fi
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-evidence-${{ matrix.platform }}
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/plexi-installer-*
