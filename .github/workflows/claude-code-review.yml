name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the changes in PR #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            Fetch the diff with: gh pr diff ${{ github.event.pull_request.number }}
            Post a review using: gh pr review ${{ github.event.pull_request.number }} --comment -b "<your review>"
            Focus on bugs, correctness issues, and anything that would break at runtime. Skip style nits.
