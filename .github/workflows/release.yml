name: Build and publish Plexi release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z[-alpha.N|-beta.N] tag to publish
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            kind: macos-arm64
          - name: macOS x64
            os: macos-13
            kind: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            kind: linux-x64
          - name: Windows x64
            os: windows-latest
            kind: windows-x64
    runs-on: ${{ matrix.os }}
    # Windows has not yet had its first hosted platform validation, and macOS
    # bundling depends on cargo-bundle tooling that can drift. Keep the Linux
    # release path publishable while a mac/Windows tooling miss is fixed.
    continue-on-error: ${{ matrix.kind == 'windows-x64' || startsWith(matrix.kind, 'macos-') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: matrix.kind == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgtk-3-dev \
            libudev-dev libegl1-mesa-dev libgles2-mesa-dev \
            mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools python3-dev
      - name: Build macOS bundle
        if: startsWith(matrix.kind, 'macos-')
        run: |
          # Pinned: 0.12 moved osx_info_plist_exts under nested macos/osx
          # settings, which Cargo.toml's top-level metadata does not use.
          cargo install cargo-bundle --version 0.11.0 --locked
          cargo bundle --release
          mkdir -p dist/package
          cp -R target/release/bundle/osx/Plexi.app dist/package/
          cp target/release/plexi dist/package/plexi
          tar -C dist/package -czf dist/plexi-${{ matrix.kind }}.tar.gz Plexi.app plexi
      - name: Build Linux archive
        if: matrix.kind == 'linux-x64'
        run: |
          cargo build --release --bin plexi
          mkdir -p dist/package
          install -m 0755 target/release/plexi dist/package/plexi
          tar -C dist/package -czf dist/plexi-linux-x64.tar.gz plexi
      - name: Build Windows archive
        if: matrix.kind == 'windows-x64'
        shell: pwsh
        run: |
          cargo build --release --bin plexi
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item target\release\plexi.exe dist\package\plexi.exe
          Compress-Archive -Path dist\package\plexi.exe -DestinationPath dist\plexi-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kind }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Classify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=false; latest=true
          if [[ "$TAG" == *-alpha.* || "$TAG" == *-beta.* || "$TAG" == *-* ]]; then
            prerelease=true; latest=false
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--title "$TAG" --generate-notes --latest="$latest")
            [[ "$prerelease" == true ]] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
