name: Build and publish Plexi release

# Every push to alpha, beta or main publishes that branch's next release when
# it has new commits (scripts/release-next-tag.sh): alpha -> vX.Y.Z-alpha.N,
# beta -> vX.Y.Z-beta.N, main -> vX.Y.Z. main fails when it has commits but no
# version bump. A newer push to the same branch cancels a run still building.
# Dispatch republishes an existing tag or runs the verify/signing checks.
on:
  push:
    branches: [alpha, beta, main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (or source ref for verification only)
        required: true
        type: string
      verify_only:
        description: Run package/signing acceptance without publishing a release
        type: boolean
        default: false
      verify_stable:
        description: Exercise the stable package path when verify_only is true
        type: boolean
        default: false
      signing_only:
        description: Check only signing credentials on a disposable Mac runner; never publish
        type: boolean
        default: false
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  next-tag:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Compute the release tag
        id: tag
        run: |
          tag=$(bash scripts/release-next-tag.sh '${{ github.ref_name }}' '${{ github.sha }}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${tag:-no new commits since the last ${{ github.ref_name }} release; nothing to publish}"
  signing:
    if: ${{ inputs.signing_only }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Import the persistent signing identity
        timeout-minutes: 2
        env:
          PLEXI_RELEASE_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
          PLEXI_RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
          PLEXI_RELEASE_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
        run: bash scripts/setup-release-signing.sh
      - name: Sign and verify a changed executable
        run: |
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          codesign --force --sign "$PLEXI_SIGN_IDENTITY" --keychain "$PLEXI_SIGNING_KEYCHAIN" --identifier com.ianjamesburke.plexi-alpha "$RUNNER_TEMP/signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/signing-probe"
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          from scripts.package import macos_signature
          actual = macos_signature(Path(os.environ['RUNNER_TEMP']) / 'signing-probe')
          assert actual['authorities'][0] == 'Plexi Dev', actual
          assert actual['certificate_sha1'] == os.environ['PLEXI_SIGNING_CERT_SHA1'], actual
          print('PASS: protected identity imported and signed executable verified')
          PY
      - name: Remove temporary signing trust and Keychain
        if: always()
        run: |
          bash scripts/setup-release-signing.sh --cleanup
  packages:
    needs: next-tag
    if: ${{ !cancelled() && !inputs.signing_only && (github.event_name == 'workflow_dispatch' || needs.next-tag.outputs.tag != '') }}
    uses: ./.github/workflows/distribution.yml
    with:
      ref: ${{ inputs.tag || github.sha }}
      tag: ${{ inputs.verify_only && (inputs.verify_stable && 'v0.0.0' || 'v0.0.0-alpha.0') || inputs.tag || needs.next-tag.outputs.tag }}
    secrets:
      PLEXI_RELEASE_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
      PLEXI_RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
      PLEXI_RELEASE_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
  publish:
    needs: [next-tag, packages]
    if: ${{ !cancelled() && needs.packages.result == 'success' && !inputs.verify_only && !inputs.signing_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish only the complete verified asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || needs.next-tag.outputs.tag }}
        run: |
          # Tag only after the packages passed, so a failed or cancelled build
          # never burns a release number.
          if [[ '${{ github.event_name }}' == push ]]; then
            git tag "$TAG" '${{ github.sha }}'
            git push origin "refs/tags/$TAG"
          fi
          bash scripts/publish-release.sh "$TAG" dist
          # Tags pushed with GITHUB_TOKEN trigger no workflow, so dispatch the
          # SDK publish; it runs on stable tags only.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh workflow run publish-sdk.yml --ref "$TAG"
          fi
