name: Build and publish Plexi release

# Releases come from two triggers (scripts/release-next-tag.sh picks the tag).
# Beta (dispatch with nightly=true, sent by `just promote beta`; the cron is
# only a backstop): when the beta branch has commits since the last beta tag,
# build and test its head, and only if every package passes tag that exact
# commit vX.Y.Z-beta.N and publish it; no new commits means no heavy jobs and
# no release. The beta branch moves only by `just promote beta`. GitHub starts
# this repo's scheduled runs 4 to 10 hours late and sometimes not at all, so
# nothing may depend on the cron's time. A push to main publishes vX.Y.Z (promoted by hand with
# `just promote main`); main fails when it has commits but no version bump.
# Pushes to alpha and beta publish nothing; alpha is installed from source. A started
# release always finishes. Dispatch with a tag republishes it or runs the
# verify/signing checks.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *" # backstop for a beta that did not publish; starts hours late
  workflow_dispatch:
    inputs:
      nightly:
        description: Release the beta branch now (leave tag empty)
        type: boolean
        default: false
      tag:
        description: Existing immutable release tag (or source ref for verification only); required unless nightly
        required: false
        default: ""
        type: string
      verify_only:
        description: Run package/signing acceptance without publishing a release
        type: boolean
        default: false
      verify_stable:
        description: Exercise the stable package path when verify_only is true
        type: boolean
        default: false
      signing_only:
        description: Check only signing credentials on a disposable Mac runner; never publish
        type: boolean
        default: false
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly-beta' || inputs.tag || github.ref_name }}
  # A started release always finishes; later pushes wait, and only the newest
  # waiting run is kept. Cancelling on push starved alpha releases during
  # merge bursts (four of nine runs on 2026-11-23).
  cancel-in-progress: false
jobs:
  next-tag:
    if: ${{ !inputs.signing_only }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Compute the release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          INPUT_TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$NIGHTLY" != true ]]; then
            [[ -n "$INPUT_TAG" ]] || { echo "error: dispatch needs a tag unless nightly is set" >&2; exit 1; }
            exit 0
          fi
          if [[ "$NIGHTLY" == true ]]; then
            [[ -z "$INPUT_TAG" ]] || { echo "error: nightly takes no tag input" >&2; exit 1; }
            branch=beta
            sha=$(git rev-parse refs/remotes/origin/beta)
          else
            branch=$BRANCH
            sha=$PUSH_SHA
          fi
          tag=$(bash scripts/release-next-tag.sh "$branch" "$sha")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${tag:-no new commits since the last $branch release; nothing to publish}"
  signing:
    if: ${{ inputs.signing_only }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Import the persistent signing identity
        timeout-minutes: 2
        env:
          PLEXI_RELEASE_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
          PLEXI_RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
          PLEXI_RELEASE_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
        run: bash scripts/setup-release-signing.sh
      - name: Sign and verify a changed executable
        run: |
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          codesign --force --sign "$PLEXI_SIGN_IDENTITY" --keychain "$PLEXI_SIGNING_KEYCHAIN" --identifier com.ianjamesburke.plexi-alpha "$RUNNER_TEMP/signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/signing-probe"
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          from scripts.package import macos_signature
          actual = macos_signature(Path(os.environ['RUNNER_TEMP']) / 'signing-probe')
          assert actual['authorities'][0] == 'Plexi Dev', actual
          assert actual['certificate_sha1'] == os.environ['PLEXI_SIGNING_CERT_SHA1'], actual
          print('PASS: protected identity imported and signed executable verified')
          PY
      - name: Remove temporary signing trust and Keychain
        if: always()
        run: |
          bash scripts/setup-release-signing.sh --cleanup
  packages:
    needs: next-tag
    if: ${{ !cancelled() && !inputs.signing_only && needs.next-tag.result == 'success' && (needs.next-tag.outputs.tag != '' || inputs.tag != '') }}
    uses: ./.github/workflows/distribution.yml
    with:
      ref: ${{ needs.next-tag.outputs.sha || inputs.tag }}
      tag: ${{ inputs.verify_only && (inputs.verify_stable && 'v0.0.0' || 'v0.0.0-alpha.0') || needs.next-tag.outputs.tag || inputs.tag }}
    secrets:
      PLEXI_RELEASE_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
      PLEXI_RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
      PLEXI_RELEASE_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
  publish:
    needs: [next-tag, packages]
    if: ${{ !cancelled() && needs.packages.result == 'success' && !inputs.verify_only && !inputs.signing_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.next-tag.outputs.sha || inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish only the complete verified asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.next-tag.outputs.tag || inputs.tag }}
          SHA: ${{ needs.next-tag.outputs.sha }}
        run: |
          # Tag only after the packages passed, so a failed or cancelled build
          # never burns a release number. The tag goes on the tested commit,
          # never on a newer alpha tip.
          if [[ -n "$SHA" ]]; then
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
          bash scripts/publish-release.sh "$TAG" dist
          # Tags pushed with GITHUB_TOKEN trigger no workflow, so dispatch the
          # SDK publish; it runs on stable tags only.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh workflow run publish-sdk.yml --ref "$TAG"
          fi
