name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Fetch Python runtime
        run: PYTHON_VERSION=3.12.13 PYTHON_PBS_DATE=20260414 bash scripts/fetch-python-runtime.sh

      - name: Build app bundle
        run: cargo bundle --release --bin plexi

      - name: Ad-hoc sign (required for ARM64)
        run: codesign --force --deep --sign - target/release/bundle/osx/plexi.app

      - name: Create zip
        run: |
          cd target/release/bundle/osx
          zip -r Plexi-${{ github.ref_name }}.zip plexi.app

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Extract release notes
        id: notes
        run: |
          notes=$(git-cliff --latest --strip header)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/osx/Plexi-${{ github.ref_name }}.zip
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
