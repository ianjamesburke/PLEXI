name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build app bundle
        run: cargo bundle --release

      - name: Ad-hoc sign (required for ARM64)
        run: codesign --force --deep --sign - target/release/bundle/osx/Plexi.app

      - name: Create zip
        run: |
          cd target/release/bundle/osx
          zip -r Plexi-${{ github.ref_name }}.zip Plexi.app

      - name: Extract release notes since last tag
        id: notes
        run: |
          # Find the previous tag (the one before the tag being released)
          prev_tag=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
          prev_ver=${prev_tag#v}
          # Collect every CHANGELOG entry from the top until we reach prev_ver.
          # If there is no previous tag, include everything.
          notes=$(awk -v stop="$prev_ver" '
            /^## \[/ {
              if (stop != "") {
                match($0, /\[([^]]+)\]/, arr)
                if (arr[1] == stop) exit
              }
              found=1
            }
            found { print }
          ' CHANGELOG.md)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/osx/Plexi-${{ github.ref_name }}.zip
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
