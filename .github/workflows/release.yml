name: Build and publish Plexi release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (or source ref for verification only)
        required: true
        type: string
      verify_only:
        description: Run package/signing acceptance without publishing a release
        type: boolean
        default: false
      verify_stable:
        description: Exercise the stable package path when verify_only is true
        type: boolean
        default: false
      signing_only:
        description: Check only signing credentials on a disposable Mac runner; never publish
        type: boolean
        default: false
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  signing:
    if: ${{ inputs.signing_only }}
    runs-on: macos-15
    timeout-minutes: 5
    environment: release-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Refuse to sign without a required human reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-approval-gate.py release-signing
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Import the persistent signing identity
        timeout-minutes: 2
        env:
          PLEXI_RELEASE_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
          PLEXI_RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
          PLEXI_RELEASE_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
        run: bash scripts/setup-release-signing.sh
      - name: Sign and verify a changed executable
        run: |
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          codesign --force --sign "$PLEXI_SIGN_IDENTITY" --keychain "$PLEXI_SIGNING_KEYCHAIN" --identifier com.ianjamesburke.plexi-alpha "$RUNNER_TEMP/signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/signing-probe"
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          from scripts.package import macos_signature
          actual = macos_signature(Path(os.environ['RUNNER_TEMP']) / 'signing-probe')
          assert actual['authorities'][0] == 'Plexi Dev', actual
          assert actual['certificate_sha1'] == os.environ['PLEXI_SIGNING_CERT_SHA1'], actual
          print('PASS: protected identity imported and signed executable verified')
          PY
      - name: Remove temporary signing trust and Keychain
        if: always()
        run: |
          bash scripts/setup-release-signing.sh --cleanup
  packages:
    if: ${{ !inputs.signing_only }}
    uses: ./.github/workflows/distribution.yml
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.tag || github.ref }}
      tag: ${{ inputs.verify_only && (inputs.verify_stable && 'v0.0.0' || 'v0.0.0-alpha.0') || inputs.tag || github.ref_name }}
    # Passed by name: the values exist only in the `release-signing`
    # environment, which the signing legs of distribution.yml declare.
    secrets:
      PLEXI_ALPHA_SIGNING_P12_BASE64: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_BASE64 }}
      PLEXI_ALPHA_SIGNING_P12_PASSWORD: ${{ secrets.PLEXI_ALPHA_SIGNING_P12_PASSWORD }}
      PLEXI_ALPHA_SIGNING_CERT_SHA1: ${{ secrets.PLEXI_ALPHA_SIGNING_CERT_SHA1 }}
  verify-evidence:
    name: verify-only evidence ${{ inputs.tag }}
    if: ${{ inputs.verify_only && !inputs.signing_only }}
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Require the dispatch source to equal the run commit
        env:
          SOURCE: ${{ inputs.tag }}
          HEAD: ${{ github.sha }}
        run: test "$SOURCE" = "$HEAD"
  # Gated through `packages`: its required macOS leg cannot sign or succeed
  # until a human approves the `release-signing` environment.
  publish:
    if: ${{ !inputs.verify_only && !inputs.signing_only }}
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish only the complete verified asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/publish-release.sh "$TAG" dist
