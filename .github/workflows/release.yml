name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build app bundle
        run: cargo bundle --release

      - name: Ad-hoc sign (required for ARM64)
        run: codesign --force --deep --sign - target/release/bundle/osx/Plexi.app

      - name: Create zip
        run: |
          cd target/release/bundle/osx
          zip -r Plexi-${{ github.ref_name }}.zip Plexi.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/osx/Plexi-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
