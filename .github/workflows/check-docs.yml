name: check docs

on:
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - 'Cargo.toml'
      - 'tools/check_docs_version.sh'
      - 'tools/check_docs_coverage.sh'
      - 'website/src/content/docs/**'
  pull_request:
    branches: [alpha]
    paths:
      - 'Cargo.toml'
      - 'tools/check_docs_version.sh'
      - 'tools/check_docs_coverage.sh'
      - 'website/src/content/docs/**'

jobs:
  check-docs-version:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check docs version accuracy
        run: bash tools/check_docs_version.sh

  check-docs-coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check docs command coverage
        run: bash tools/check_docs_coverage.sh
