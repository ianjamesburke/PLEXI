name: check docs

on:
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - 'tools/check_docs_coverage.sh'
      - 'tools/gen_sdk_docs.py'
      - 'tools/gen_capability_docs.py'
      - 'tools/check_authoring_docs.py'
      - 'sdk/python/plexi_sdk/**'
      - 'sdk/python/AUTHORING.md'
      - 'sdk/python/README.md'
      - 'sdk/python/AGENTS.md'
      - 'apps/AGENTS.md'
      - 'src/cli/args.rs'
      - 'sdk/protocol/pgap.schema.json'
      - 'website/src/content/docs/**'
  pull_request:
    branches: [alpha]
    paths:
      - 'tools/check_docs_coverage.sh'
      - 'tools/gen_sdk_docs.py'
      - 'tools/gen_capability_docs.py'
      - 'tools/check_authoring_docs.py'
      - 'sdk/python/plexi_sdk/**'
      - 'sdk/python/AUTHORING.md'
      - 'sdk/python/README.md'
      - 'sdk/python/AGENTS.md'
      - 'apps/AGENTS.md'
      - 'src/cli/args.rs'
      - 'sdk/protocol/pgap.schema.json'
      - 'website/src/content/docs/**'

jobs:
  check-docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check docs command coverage
        run: bash tools/check_docs_coverage.sh

  check-sdk-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check SDK docs freshness
        run: |
          python3 tools/gen_sdk_docs.py --stdout > /tmp/plexi_check_sdk.md
          if ! diff -q website/src/content/docs/sdk.md /tmp/plexi_check_sdk.md > /dev/null; then
            echo "ERROR: website/src/content/docs/sdk.md is stale. Run 'just gen-sdk-docs' and commit."
            diff website/src/content/docs/sdk.md /tmp/plexi_check_sdk.md || true
            exit 1
          fi
          echo "SDK docs are up to date."

  check-capability-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check PGAP capability docs freshness
        run: |
          python3 tools/gen_capability_docs.py --stdout > /tmp/plexi_check_pgap.md
          if ! diff -q website/src/content/docs/pgap.md /tmp/plexi_check_pgap.md > /dev/null; then
            echo "ERROR: website/src/content/docs/pgap.md is stale. Run 'just gen-capability-docs' and commit."
            diff website/src/content/docs/pgap.md /tmp/plexi_check_pgap.md || true
            exit 1
          fi
          echo "PGAP capability docs are up to date."

  check-authoring-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check app-authoring guidance drift
        run: python3 tools/check_authoring_docs.py
