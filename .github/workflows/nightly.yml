name: Nightly alpha

# Hosted full verification for direct-to-alpha work. Per-push Rust host CI was
# removed (stint 0799); the local gate is the merge gate. This runs the full
# host tests, then, only if alpha has commits since the last alpha tag, tags
# the next vX.Y.Z-alpha.N and dispatches release.yml (package, signing and
# A-to-B Keychain continuity gates, then publish). Never promotes beta/stable.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-alpha
  cancel-in-progress: false

jobs:
  host:
    uses: ./.github/workflows/rust-host.yml
  tag:
    needs: host
    # Tags only when the required macOS jobs passed, whatever the advisory
    # linux job did; a user cancelling the run still stops it.
    if: ${{ !cancelled() && needs.host.outputs.required_passed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # The host job tested github.sha (rust-host.yml checks out the caller's
      # sha). Tag exactly that commit, never the alpha tip at this later
      # moment, which may hold commits the run never tested (stint 1480).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Tag the tested commit and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          git fetch -q origin alpha
          echo "tested sha: $TESTED_SHA; alpha now: $(git rev-parse origin/alpha)"
          tag=$(bash scripts/nightly-alpha-tag.sh "$TESTED_SHA" origin/alpha)
          if [[ -z "$tag" ]]; then
            echo "the tested commit has no commits since the last alpha tag; nothing to release"
            exit 0
          fi
          git tag "$tag" "$TESTED_SHA"
          git push origin "refs/tags/$tag"
          # Tag pushes made with GITHUB_TOKEN do not trigger release.yml.
          # release.yml checks out inputs.tag, so it builds the tested sha.
          gh workflow run release.yml --ref alpha -f tag="$tag"
