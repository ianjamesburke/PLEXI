name: Rust host

# Manual full host suite on macOS: everything the release build's
# `cargo test --bin plexi` runs, plus the requires-pty tests and egui_term.
# Release gating lives in release.yml; this is for on-demand investigation.
# Reads repository contents only: no secrets, no signing identity.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLEXI_CPYTHON_BUNDLE_DIR: /Users/runner/.plexi-ci/wasm-bundles

jobs:
  test:
    name: test
    runs-on: macos-latest
    # A warm-cache run took 26.8 min on 2026-11-01. Cold-cache runs on
    # 2026-11-26 and 2026-11-27 spent 31 min building and were cut off at 45
    # mid-suite, so the limit leaves room for a cold build plus the full suite.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Plexi CI environment
        uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: test
          cpython-bundle: 'true'

      - name: Build host and tests
        # Closed-stdout regression drives the real CLI, never a libtest child.
        # Cargo goes through cargo-channel-inputs.py: CI has no .channel, and
        # raw Cargo reruns build.rs (recompiling plexi) on every invocation
        # while that watched file is missing.
        run: |
          python3 scripts/cargo-channel-inputs.py build --release --bin plexi
          python3 scripts/cargo-channel-inputs.py test --bin plexi --no-run
          python3 scripts/cargo-channel-inputs.py test -p egui_term --no-run

      - name: Test host
        # Every non-ignored test runs, including the network-fetched
        # CPython-WASI integration test, whose sha256-verified bundle the setup
        # action restores from the Actions cache (fetching it in its own step on
        # a miss, so a network failure is attributed to the fetch, not the test).
        # Ignored tests are skipped here; `real_cpython_bundle_resolves_but_is_abi_blocked`
        # is #[ignore] and not covered by the PTY step either.
        run: |
          env -u PLEXI_CHANNEL -u PLEXI_CONTEXT_ROOT -u PLEXI_CONTEXT_ID \
            -u PLEXI_CONTEXT_NAME -u PLEXI_SOCKET -u PLEXI_RUNNING -u PLEXI_PANE_ID \
            python3 scripts/cargo-channel-inputs.py test --bin plexi

      - name: Test plexi-protocol
        run: python3 scripts/cargo-channel-inputs.py test -p plexi-protocol

      - name: Test plexi-host-model
        run: python3 scripts/cargo-channel-inputs.py test -p plexi-host-model

      - name: Test host PTY
        # The `#[ignore = "requires-pty"]` tests (stint 1563). The runner can
        # open PTYs and spawn shells, so they run here. Every other ignored
        # test is skipped by name: the perf gates and profile_ workloads need a
        # quiet machine (profile_ also needs PLEXI_UI_PROFILE=1),
        # scene_single takes PLEXI_SCENE, the logger test needs an isolated
        # process, and the CPython bundle test needs a local bundle. A new
        # ignored test not on this list runs here and fails loudly.
        run: |
          env -u PLEXI_CHANNEL -u PLEXI_CONTEXT_ROOT -u PLEXI_CONTEXT_ID \
            -u PLEXI_CONTEXT_NAME -u PLEXI_SOCKET -u PLEXI_RUNNING -u PLEXI_PANE_ID \
            python3 scripts/cargo-channel-inputs.py test --bin plexi -- --ignored \
              --skip perf_gate_ \
              --skip ui_tests::tests::terminal::profile_ \
              --skip scenes::tests::scene_single \
              --skip app::registry::manifest_contract::tests::schema2_rejections_emit_info_with_plugin_field_and_reason \
              --skip host::wasm_python::tests::real_cpython_bundle_resolves_but_is_abi_blocked

      - name: Test egui_term
        # deps/egui_term is a path dependency, not a workspace member, so
        # `--bin plexi` never runs its unit tests (stint 1563).
        run: python3 scripts/cargo-channel-inputs.py test -p egui_term

  clippy:
    name: clippy
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Plexi CI environment
        uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: clippy

      - name: Lint host
        run: cargo clippy --bin plexi -- -D warnings
