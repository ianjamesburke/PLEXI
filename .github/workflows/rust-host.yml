name: Rust host

on:
  push:
    branches: [alpha]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'website/**'
      - '.stint/**'
  pull_request:
    branches: [alpha]
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
      - 'docs/**'
      - 'website/**'
      - '.stint/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLEXI_CPYTHON_BUNDLE_DIR: /Users/runner/.plexi-ci/wasm-bundles

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Plexi CI environment
        uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: test
          cpython-bundle: 'true'

      - name: Test host
        # Zero skips: the whole suite runs, including the network-fetched
        # CPython-WASI integration test, whose sha256-verified bundle the setup
        # action restores from the Actions cache (fetching it in its own step on
        # a miss, so a network failure is attributed to the fetch, not the test).
        run: |
          env -u PLEXI_CHANNEL -u PLEXI_CONTEXT_ROOT -u PLEXI_CONTEXT_ID \
            -u PLEXI_CONTEXT_NAME -u PLEXI_SOCKET -u PLEXI_RUNNING -u PLEXI_PANE_ID \
            cargo test --bin plexi

  clippy:
    name: clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Plexi CI environment
        uses: ./.github/actions/plexi-ci-env
        with:
          cache-key: clippy

      - name: Lint host
        run: cargo clippy --bin plexi -- -D warnings
