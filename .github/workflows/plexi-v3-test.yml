name: v3 test matrix

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: macos-latest
    env:
      PLEXI_AUDIO: "mock://"
      PLEXI_VIDEO: "mock://"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cargo test (lib + Layer-1 integration + Layer-2 host)
        run: cargo test --release -- --nocapture

      - name: uv sync + pytest (SDK widgets + example Layer-1 Python harness)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --all-groups
          uv run pytest -q

      - name: Post-install smoke test (host starts + renders without panic)
        run: bash scripts/smoke-test.sh
