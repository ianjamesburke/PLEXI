[app]
protocol_version = 2id          = "mermaid-viewer"
name        = "Mermaid Viewer"
entry       = "mermaid_viewer.py"
version     = "0.1.0"
description = "Keyboard-driven mermaid diagram viewer and editor"

[app.capabilities]
filesystem     = "read_write"
network        = false
terminal_write = false
mouse_tracking = false

[app.layout]
min_width  = 400
min_height = 300

[app.launch]
args = []

[app.spawnable]
spawnable = true
accept_args = true
allow_callers   = ["*"]
allow_lifecycle = ["cascade", "orphan"]
