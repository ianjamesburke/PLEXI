<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>state_sonnet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Constants ────────────────────────────────────────────────────────────────
const GRAVITY          = 0.42;
const GROUND_Y         = 460;
const MAX_VX           = 22;
const FRICTION_GROUND  = 0.992;   // low — skater glides
const FRICTION_AIR     = 0.999;
const PUSH_SPEED       = 5.5;     // vx added per push
const PUSH_COOLDOWN_F  = 28;      // frames between pushes
const CROUCH_MAX_F     = 50;
const BASE_JUMP_VY     = -12;
const CROUCH_BONUS_VY  = -5;      // extra vy per full crouch
const AIR_ROTATE_SPEED = 0.075;   // rad/frame from arrow key
const BAIL_ANGLE       = Math.PI * 0.28; // ~50° — past this on landing = bail
const KICKFLIP_SPEED   = 14;      // degrees/frame board spins
const KICKFLIP_BONUS   = 2.5;     // vx bonus for clean landing
const HALF_W           = 8;

// ── World ─────────────────────────────────────────────────────────────────────
const WORLD_W = 5000;
const boxes = [
  { x: 900,  w: 120, h: 75  },
  { x: 1600, w: 80,  h: 48  },
  { x: 2200, w: 160, h: 105 },
  { x: 3000, w: 100, h: 62  },
  { x: 3700, w: 140, h: 88  },
];
boxes.forEach(b => { b.y = GROUND_Y - b.h; });

// ── State ─────────────────────────────────────────────────────────────────────
let mode = 'start';
let distanceTraveled = 0;
let bestDistance = 0;

const player = {
  x: 160, y: GROUND_Y,
  vx: 0, vy: 0,
  onGround: true,
  // ollie
  crouchFrames: 0,
  // air rotation
  bodyAngle: 0,    // radians — whole skater rotates in air
  angularVel: 0,
  // kickflip
  kickflipActive: false,
  boardFlipAngle: 0,  // degrees 0→360
  kickflipQueued: false, // Up held at pop moment
  // push
  pushCooldown: 0,
  pushDir: 1,       // 1 = right, -1 = left
  // state
  bailed: false,
  bailTimer: 0,
  justLanded: false,
  landedClean: false,
  landBonus: 0,
};

const camera = { x: 0 };

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyX','KeyZ'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'KeyF') { toggleFullscreen(); return; }
  // Start/restart: don't bleed the key press into game state
  if ((e.code === 'Space' || e.code === 'Enter') && (mode === 'start' || mode === 'over')) {
    startGame();
    return;
  }
  keys[e.code] = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && mode === 'playing') handlePop();
  keys[e.code] = false;
});

function startGame() {
  mode = 'playing';
  Object.assign(player, {
    x: 160, y: GROUND_Y, vx: 0, vy: 0,
    onGround: true, crouchFrames: 0,
    bodyAngle: 0, angularVel: 0,
    kickflipActive: false, boardFlipAngle: 0, kickflipQueued: false,
    pushCooldown: 0, pushDir: 1,
    bailed: false, bailTimer: 0, justLanded: false, landedClean: false, landBonus: 0,
  });
  camera.x = 0;
  distanceTraveled = 0;
}

function handlePop() {
  if (!player.onGround || player.bailed) return;
  const t = Math.min(player.crouchFrames / CROUCH_MAX_F, 1);
  if (t < 0.04) { player.crouchFrames = 0; return; } // tap — no ollie
  player.vy = BASE_JUMP_VY + CROUCH_BONUS_VY * t;
  player.onGround = false;
  // carry horizontal velocity — no extra push on pop itself
  player.kickflipQueued = !!keys['ArrowUp'];
  player.kickflipActive = false;
  player.boardFlipAngle = 0;
  player.angularVel = 0;
  player.crouchFrames = 0;
}

// ── Physics ───────────────────────────────────────────────────────────────────
function update() {
  if (mode !== 'playing') return;

  if (player.bailed) {
    player.bailTimer--;
    if (player.bailTimer <= 0) {
      player.bailed = false;
      player.bodyAngle = 0;
      player.vx = 0;
    }
    // still apply gravity / slide while bailed
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; }
    camera.x += (player.x - canvas.width * 0.35 - camera.x) * 0.08;
    return;
  }

  player.justLanded = false;
  player.pushCooldown = Math.max(0, player.pushCooldown - 1);

  // ── Push (X / Z / ArrowDown) ─────────────────────────────────────────────
  const pushPressed = keys['KeyX'] || keys['KeyZ'] || keys['ArrowDown'];
  if (pushPressed && player.onGround && player.pushCooldown === 0) {
    const dir = (keys['ArrowLeft'] && !keys['ArrowRight']) ? -1 : 1;
    player.pushDir = dir;
    player.vx += dir * PUSH_SPEED;
    player.vx = Math.sign(player.vx) * Math.min(Math.abs(player.vx), MAX_VX);
    player.pushCooldown = PUSH_COOLDOWN_F;
  }

  // ── Crouch tracking ───────────────────────────────────────────────────────
  if (keys['Space'] && player.onGround) {
    player.crouchFrames = Math.min(player.crouchFrames + 1, CROUCH_MAX_F);
  }

  // ── Air controls ─────────────────────────────────────────────────────────
  if (!player.onGround) {
    // Body rotation — left/right arrows spin the skater
    if (keys['ArrowLeft'])  player.angularVel -= AIR_ROTATE_SPEED;
    if (keys['ArrowRight']) player.angularVel += AIR_ROTATE_SPEED;
    // Dampen angular velocity slightly
    player.angularVel *= 0.92;
    player.bodyAngle += player.angularVel;

    // Kickflip — activate once on first airborne frame if queued
    if (player.kickflipQueued) {
      player.kickflipActive = true;
      player.kickflipQueued = false;
    }
    if (player.kickflipActive) {
      player.boardFlipAngle += KICKFLIP_SPEED;
    }
  }

  // ── Gravity + friction ────────────────────────────────────────────────────
  player.vy += GRAVITY;
  if (player.onGround) {
    player.vx *= FRICTION_GROUND;
    if (Math.abs(player.vx) < 0.15) player.vx = 0;
  } else {
    player.vx *= FRICTION_AIR;
  }

  player.x += player.vx;
  player.y += player.vy;

  // ── Collisions ────────────────────────────────────────────────────────────
  const wasOnGround = player.onGround;
  player.onGround = false;

  for (const b of boxes) {
    const bL = b.x, bR = b.x + b.w, bTop = b.y;
    if (player.x + HALF_W <= bL || player.x - HALF_W >= bR) continue;

    const prevFeet = player.y - player.vy;
    if (player.vy >= 0 && prevFeet <= bTop + 1 && player.y >= bTop) {
      player.y = bTop;
      player.vy = 0;
      player.onGround = true;
      checkLanding(wasOnGround);
      continue;
    }
    if (player.y > bTop + 2 && player.vy >= 0) {
      if (player.vx > 0) { player.x = bL - HALF_W; player.vx = 0; }
      else if (player.vx < 0) { player.x = bR + HALF_W; player.vx = 0; }
    }
  }

  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    checkLanding(wasOnGround);
  }

  if (player.x < 50) { player.x = 50; player.vx = 0; }

  distanceTraveled = Math.max(distanceTraveled, Math.floor(player.x / 10));
  if (distanceTraveled > bestDistance) bestDistance = distanceTraveled;

  camera.x += (player.x - canvas.width * 0.35 - camera.x) * 0.09;
  camera.x = Math.max(0, camera.x);
}

function checkLanding(wasOnGround) {
  if (wasOnGround) return; // was already on ground, not a new landing

  player.justLanded = true;
  const norm = normalizeAngle(player.bodyAngle);

  if (Math.abs(norm) > BAIL_ANGLE) {
    // Bailed — too tilted
    player.bailed = true;
    player.bailTimer = 90;
    player.landedClean = false;
    player.landBonus = 0;
  } else {
    player.landedClean = true;
    let bonus = 0;
    // Clean kickflip: board did at least one full rotation
    if (player.kickflipActive && player.boardFlipAngle >= 360) {
      bonus = KICKFLIP_BONUS;
      player.vx = Math.sign(player.vx || player.pushDir) * Math.min(Math.abs(player.vx) + bonus, MAX_VX);
    }
    player.landBonus = bonus;
    player.kickflipActive = false;
    player.boardFlipAngle = 0;
    player.bodyAngle = 0;
    player.angularVel = 0;
  }
}

function normalizeAngle(a) {
  a = a % (Math.PI * 2);
  if (a > Math.PI) a -= Math.PI * 2;
  if (a < -Math.PI) a += Math.PI * 2;
  return a;
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function toScreen(wx) { return wx - camera.x; }

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0,   '#0a1520');
  grad.addColorStop(0.65,'#12202e');
  grad.addColorStop(1,   '#1a2c3c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  const stars = [82,41,167,84,244,31,321,92,403,57,481,22,563,78,641,47,722,88,803,37,884,62,965,26,1046,72,1127,51,200,110,380,95,560,115,740,105];
  for (let i = 0; i < stars.length; i += 2) {
    ctx.beginPath();
    ctx.arc(stars[i] % canvas.width, stars[i+1], 1, 0, Math.PI*2);
    ctx.fill();
  }

  // City silhouette
  ctx.fillStyle = '#111d28';
  const bldgs = [0,390,80,70,90,348,60,112,160,368,50,92,220,308,70,152,300,358,55,102,365,378,45,82,420,328,80,132,510,368,60,92,580,348,70,112,660,388,50,72,720,318,90,142,820,368,55,92,885,338,75,122,970,378,50,82,1030,358,65,102,1100,328,85,132];
  for (let i = 0; i < bldgs.length; i += 4) {
    const [bx, by, bw, bh] = [bldgs[i] % canvas.width, bldgs[i+1], bldgs[i+2], bldgs[i+3]];
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(255,210,80,0.1)';
    for (let wy = by+10; wy < by+bh-10; wy+=18) {
      for (let wx = bx+8; wx < bx+bw-8; wx+=14) {
        if ((wx+wy)%3!==0) ctx.fillRect(wx, wy, 6, 8);
      }
    }
    ctx.fillStyle = '#111d28';
  }
}

function drawGround() {
  ctx.strokeStyle = '#3a88dd';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  const grad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
  grad.addColorStop(0, '#162540');
  grad.addColorStop(1, '#0a1520');
  ctx.fillStyle = grad;
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  // Distance markers
  ctx.strokeStyle = 'rgba(58,136,221,0.2)';
  ctx.lineWidth = 1;
  const step = 200;
  for (let mx = Math.floor(camera.x/step)*step; mx < camera.x + canvas.width + step; mx += step) {
    const sx = toScreen(mx);
    ctx.beginPath(); ctx.moveTo(sx, GROUND_Y); ctx.lineTo(sx, GROUND_Y+18); ctx.stroke();
    ctx.fillStyle='rgba(58,136,221,0.35)';
    ctx.font='9px monospace';
    ctx.fillText(`${Math.floor(mx/10)}m`, sx+3, GROUND_Y+14);
  }
}

function drawBox(b) {
  const sx = toScreen(b.x);
  if (sx + b.w < 0 || sx > canvas.width) return;

  const grad = ctx.createLinearGradient(sx, b.y, sx, b.y + b.h);
  grad.addColorStop(0, '#2e527a');
  grad.addColorStop(1, '#182c45');
  ctx.fillStyle = grad;
  ctx.fillRect(sx, b.y, b.w, b.h);
  ctx.fillStyle = '#3a6590';
  ctx.fillRect(sx, b.y, b.w, 5);
  ctx.strokeStyle = '#4a85ba';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(sx, b.y, b.w, b.h);
  // grind rail
  ctx.strokeStyle = '#99ccff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx+8, b.y+2.5);
  ctx.lineTo(sx+b.w-8, b.y+2.5);
  ctx.stroke();
}

function drawSkater(p) {
  const sx = toScreen(p.x);
  const crouchT = (keys['Space'] && p.onGround && !p.bailed)
    ? Math.min(p.crouchFrames / CROUCH_MAX_F, 1) : 0;

  const standH = 70;
  const bodyH  = standH - (standH - 42) * crouchT;
  const hipY   = -bodyH * 0.44;
  const torsoY = -bodyH;
  const headY  = -bodyH - 13;

  ctx.save();
  ctx.translate(sx, p.y);

  // Apply whole-body rotation while airborne (or bailed)
  if (!p.onGround || p.bailed) {
    ctx.rotate(p.bodyAngle);
  }

  // ── Board ────────────────────────────────────────────────────────────────
  const boardW = 52, boardH = 7;

  ctx.save();
  // Kickflip: board spins around its long axis (horizontal flip)
  if (p.kickflipActive) {
    const flipRad = (p.boardFlipAngle % 360) * Math.PI / 180;
    ctx.scale(Math.cos(flipRad), 1); // scaleX flips the board visually
  }

  const deckGrad = ctx.createLinearGradient(-boardW/2, -boardH, boardW/2, 0);
  deckGrad.addColorStop(0, '#cc7700');
  deckGrad.addColorStop(1, '#883300');
  ctx.fillStyle = deckGrad;
  ctx.beginPath();
  ctx.roundRect(-boardW/2, -boardH, boardW, boardH, [3]);
  ctx.fill();

  // Trucks
  ctx.fillStyle = '#aaa';
  ctx.fillRect(-boardW/2+6, -boardH-3, 10, 4);
  ctx.fillRect( boardW/2-16,-boardH-3, 10, 4);

  // Wheels
  [[-boardW/2+5], [boardW/2-15]].forEach(([wx]) => {
    ctx.fillStyle = '#ddd';
    ctx.beginPath(); ctx.arc(wx+5, -boardH-1, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(wx+4, -boardH-2, 1.5, 0, Math.PI*2); ctx.fill();
  });

  ctx.restore();

  // ── Legs ─────────────────────────────────────────────────────────────────
  const kneeOff = crouchT * 14;
  ctx.strokeStyle = '#3a7bd5';
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, hipY);
  ctx.quadraticCurveTo(-12-kneeOff, hipY*0.5, -6, -boardH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, hipY);
  ctx.quadraticCurveTo(8+kneeOff, hipY*0.5, 2, -boardH);
  ctx.stroke();

  // ── Torso ────────────────────────────────────────────────────────────────
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-2, hipY); ctx.lineTo(-2, torsoY); ctx.stroke();

  // ── Arms ─────────────────────────────────────────────────────────────────
  const spd = Math.min(Math.abs(p.vx)/MAX_VX, 1);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-2, torsoY+10);
  ctx.lineTo(-14+spd*4, torsoY+24-crouchT*8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-2, torsoY+10);
  ctx.lineTo(12-spd*4, torsoY+24-crouchT*8);
  ctx.stroke();

  // ── Head ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#f0c87a';
  ctx.beginPath(); ctx.arc(-2, headY, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#cc3333';
  ctx.beginPath(); ctx.arc(-2, headY-1, 11, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#aa2222';
  ctx.fillRect(-13, headY-1, 22, 3);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(3, headY+1, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(3.5, headY+0.5, 0.8, 0, Math.PI*2); ctx.fill();

  // ── Crouch glow ───────────────────────────────────────────────────────────
  if (crouchT > 0.08) {
    const t = crouchT;
    const glow = ctx.createRadialGradient(0, hipY*0.5, 0, 0, hipY*0.5, 20*t);
    glow.addColorStop(0, `rgba(80,200,255,${t*0.38})`);
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, hipY*0.5, 20*t, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawHUD() {
  // Distance panel
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(12, 12, 170, 52);
  ctx.strokeStyle = 'rgba(58,136,221,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(12, 12, 170, 52);
  ctx.fillStyle = '#3a88dd';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('DISTANCE', 22, 28);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.fillText(`${distanceTraveled}m`, 22, 50);
  ctx.fillStyle = '#3a88dd';
  ctx.font = '10px monospace';
  ctx.fillText(`BEST: ${bestDistance}m`, 100, 28);

  // Speed bar
  const spd = Math.abs(player.vx) / MAX_VX;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(12, 70, 170, 12);
  ctx.fillStyle = spd > 0.75 ? '#ff6644' : spd > 0.45 ? '#ffcc44' : '#44aaff';
  ctx.fillRect(12, 70, 170*spd, 12);
  ctx.strokeStyle='rgba(58,136,221,0.3)'; ctx.lineWidth=1;
  ctx.strokeRect(12, 70, 170, 12);
  ctx.fillStyle='#888'; ctx.font='8px monospace';
  ctx.fillText('SPEED', 16, 80);

  // Push cooldown indicator (dot)
  if (player.pushCooldown > 0) {
    const ready = 1 - player.pushCooldown / PUSH_COOLDOWN_F;
    ctx.fillStyle = `rgba(80,255,180,${0.3 + ready*0.7})`;
    ctx.beginPath();
    ctx.arc(195, 76, 5*ready+2, 0, Math.PI*2);
    ctx.fill();
  }

  // Jump charge bar
  if (player.onGround && player.crouchFrames > 3 && !player.bailed) {
    const t = Math.min(player.crouchFrames / CROUCH_MAX_F, 1);
    const cx = canvas.width/2, bw = 130;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(cx-bw/2, canvas.height-30, bw, 14);
    ctx.fillStyle = t>0.8?'#ff4444':t>0.5?'#ffaa00':'#44ff88';
    ctx.fillRect(cx-bw/2, canvas.height-30, bw*t, 14);
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
    ctx.strokeRect(cx-bw/2, canvas.height-30, bw, 14);
    ctx.fillStyle='#fff'; ctx.font='bold 8px monospace';
    ctx.textAlign='center';
    ctx.fillText(keys['ArrowUp'] ? 'KICKFLIP' : 'OLLIE', cx, canvas.height-19);
    ctx.textAlign='left';
  }

  // Air rotation indicator
  if (!player.onGround && !player.bailed) {
    const norm = normalizeAngle(player.bodyAngle);
    const pct = norm / Math.PI; // -1 to 1
    const cx = canvas.width/2;
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(cx-60, canvas.height-28, 120, 10);
    ctx.fillStyle = Math.abs(norm) > BAIL_ANGLE*0.8 ? '#ff4444' : '#44aaff';
    ctx.fillRect(cx + pct*60 - 4, canvas.height-30, 8, 14);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
    ctx.strokeRect(cx-60, canvas.height-28, 120, 10);

    if (player.kickflipActive) {
      ctx.fillStyle='#ffee44'; ctx.font='bold 10px monospace';
      ctx.textAlign='center';
      const pct2 = Math.min(player.boardFlipAngle/360, 1);
      ctx.fillText(`FLIP ${Math.round(pct2*100)}%`, cx, canvas.height-35);
      ctx.textAlign='left';
    }
  }

  // Land feedback
  if (player.justLanded) {
    ctx.textAlign='center';
    if (player.bailed) {
      ctx.fillStyle='#ff4444'; ctx.font='bold 18px monospace';
      ctx.fillText('BAILED!', canvas.width/2, canvas.height/2 - 40);
    } else if (player.landBonus > 0) {
      ctx.fillStyle='#44ff88'; ctx.font='bold 16px monospace';
      ctx.fillText(`CLEAN FLIP! +${player.landBonus.toFixed(1)}`, canvas.width/2, canvas.height/2-40);
    }
    ctx.textAlign='left';
  }
}

function drawStartScreen() {
  ctx.fillStyle='rgba(8,16,28,0.94)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2;
  ctx.textAlign='center';
  ctx.fillStyle='#3a88dd'; ctx.font='bold 50px monospace';
  ctx.fillText('state_sonnet', cx, cy-88);
  ctx.fillStyle='#777'; ctx.font='14px monospace';
  ctx.fillText('a skateboarding simulator', cx, cy-56);

  const controls = [
    ['X / Z', 'Push (tap to kick)'],
    ['← → (ground)', 'Set push direction'],
    ['Space  hold', 'Crouch — charge ollie'],
    ['Space  release', 'Ollie'],
    ['↑ + Space', 'Kickflip'],
    ['← → (air)', 'Rotate body'],
  ];

  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(cx-210, cy-32, 420, controls.length*26+20);
  ctx.strokeStyle='rgba(58,136,221,0.25)'; ctx.lineWidth=1;
  ctx.strokeRect(cx-210, cy-32, 420, controls.length*26+20);

  controls.forEach(([k,d],i) => {
    ctx.fillStyle='#3a88dd'; ctx.font='12px monospace';
    ctx.fillText(k, cx-60, cy-6+i*26);
    ctx.fillStyle='#bbb';
    ctx.fillText(d, cx+80, cy-6+i*26);
  });

  const pulse=(Math.sin(Date.now()/400)+1)/2;
  ctx.fillStyle=`rgba(255,255,255,${0.45+pulse*0.55})`;
  ctx.font='bold 13px monospace';
  ctx.fillText('PRESS SPACE TO SKATE', cx, cy+controls.length*26+12);
  ctx.textAlign='left';
}

// ── Render loop ───────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawGround();
  boxes.forEach(drawBox);
  if (mode==='playing') {
    drawSkater(player);
    drawHUD();
  }
  if (mode==='start') drawStartScreen();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

// ── Playwright hooks ──────────────────────────────────────────────────────────
window.advanceTime = (ms) => {
  const steps = Math.max(1, Math.round(ms / (1000/60)));
  for (let i=0; i<steps; i++) update();
  render();
};

window.render_game_to_text = () => JSON.stringify({
  // Y increases downward. Ground at y=460. X increases rightward.
  mode,
  player: {
    x: Math.round(player.x), y: Math.round(player.y),
    vx: +player.vx.toFixed(2), vy: +player.vy.toFixed(2),
    onGround: player.onGround, bailed: player.bailed,
    bodyAngle: +player.bodyAngle.toFixed(3),
    kickflipActive: player.kickflipActive,
    boardFlipAngle: Math.round(player.boardFlipAngle),
    crouchFrames: player.crouchFrames,
    pushCooldown: player.pushCooldown,
  },
  camera: { x: Math.round(camera.x) },
  distance: distanceTraveled, best: bestDistance,
});

requestAnimationFrame(loop);
</script>
</body>
</html>
