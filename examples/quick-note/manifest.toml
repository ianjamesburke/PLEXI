[app]
id = "quick-note"
name = "Quick Note"
version = "0.1.0"
description = "Markdown note composer and browser. Notes saved to <workspace_root>/.plexi/notes/."
entry = "quick_note.py"

[app.capabilities]
capabilities = ["fs.read", "fs.write"]

[launch]
layout_hint = { side = "right", split = 0.3 }
