[app]
id = "todo"
name = "Todo"
version = "0.1.0"
description = "Simple todo list persisted to <workspace_root>/.plexi/todos.json."
entry = "todo.py"

[app.capabilities]
capabilities = ["fs.read", "fs.write"]
# Opt into the "cwd" pane group: receives PathChanged when any linked terminal
# in the same group moves directories. Lets the todo list track the focused cwd.
group = "cwd"
initial_share = 0.4
