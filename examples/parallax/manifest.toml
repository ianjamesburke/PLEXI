schema_version = 1

[app]
id = "parallax"
type = "app"
name = "Parallax Editor"
version = "0.1.0"
description = "Primitive video editor driven by the Parallax V0 CLI. Load clips, arrange on a timeline, set in/out points, trim, and export. AI-drivable via exposed tools."
entry = "editor.py"
default_notification_scope = "context"

[app.capabilities]
capabilities = ["video.playback", "terminal.bindings"]

[launch]
background = false
layout_hint = { side = "right", split = 0.65 }
