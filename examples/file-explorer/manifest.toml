[app]
id = "file-explorer"
name = "File Explorer"
version = "0.1.0"
description = "Directory browser that tracks the focused terminal's working directory."
entry = "file_explorer.py"

[app.capabilities]
capabilities = ["fs.read"]

[launch]
join_group = "cwd"
layout_hint = { side = "above", split = 0.75 }
