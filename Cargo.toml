[package]
name = "plexi"
version = "3.0.0-beta.5"
edition = "2021"

[package.metadata.bundle]
name = "Plexi"
identifier = "com.ianjamesburke.plexi"
icon = ["assets/app-icon.icns"]
short_description = "Spatial terminal window manager"
osx_minimum_system_version = "12.0"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", features = ["default_fonts", "wgpu"] }
egui_tiles = { version = "0.12.0", features = ["serde"] }
egui_term = { path = "deps/egui_term" }
dirs = "6"
fern = "0.7"
log = "0.4"
async-anthropic = "0.6"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tokio-stream = "0.1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
crossbeam-queue = "0.3"
hound = "3"
include_dir = "0.7"
zeroize = "1"
thiserror = "2"
# Headless renderer (step 1 added src/headless_renderer.rs without declaring these).
tiny-skia = "0.11"
fontdue = "0.9"
# HTTP broker (step 9a). Pure-Rust blocking client — no tokio.
ureq = { version = "2", default-features = false, features = ["tls"] }
# FD CLOEXEC (step 9e). fcntl for close-on-exec on pipe sockets.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.2.2", features = ["NSThread", "NSString"] }
