[workspace]
members = ["tools/gen_schema", "tools/gen_cli_docs", "sdk/rust"]
resolver = "2"

[package]
name = "plexi"
version = "0.0.696"
edition = "2021"

[package.metadata.bundle]
name = "Plexi"
identifier = "com.ianjamesburke.plexi"
icon = ["assets/app-icon.icns"]
short_description = "Spatial terminal window manager"
osx_minimum_system_version = "12.0"
# macOS TCC: triggers the system mic-permission prompt on the first
# `cpal::Stream::play()` call. Without this string the prompt is suppressed
# and capture silently records zeros (#277).
osx_info_plist_exts = ["assets/Info.plist.fragment"]
resources = ["sdk/python/plexi_sdk", "assets/python"]

[[bin]]
name = "plexi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
egui = { version = "0.31", features = ["accesskit"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_tiles = { version = "0.12.0", features = ["serde"] }
egui_term = { path = "deps/egui_term" }
dirs = "6"
fern = "0.7"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# Base64 decode for inline notification image attachments (#74).
base64 = "0.22"
crossbeam-queue = "0.3"
include_dir = "0.7"
zeroize = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Headless renderer (step 1 added src/headless_renderer.rs without declaring these).
tiny-skia = "0.11"
fontdue = "0.9"
# HTTP broker (step 9a). Pure-Rust blocking client — no tokio.
ureq = { version = "2", default-features = false, features = ["tls"] }
# URL parsing for hardened allowed_hosts validation (#1179). Already transitive via ureq.
url = "2"
# FD CLOEXEC (step 9e). fcntl for close-on-exec on pipe sockets.
libc = "0.2"
# CoreAudio capture + device enumeration (#277). Cross-platform PCM I/O.
cpal = "0.17"
# Host-owned audio playback (#341). Decoder-agnostic; MP3/FLAC/OGG/WAV via default symphonia features.
rodio = "0.22"
# Hot reload (#83). Cross-platform fs watcher; on macOS uses FSEvents.
# `macos_fsevent` is the recommended backend (kqueue is the alt, slower for
# nested dirs). default-features disabled to avoid pulling crossbeam-channel.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
egui_commonmark = "0.20"
# Native file picker dialog (#514). Uses NSOpenPanel on macOS.
rfd = "0.17"
# Headless app render (#850). Already transitive via eframe; declared directly for explicit use.
pollster = "0.4"
wgpu = { version = "24", default-features = false, features = ["wgsl", "metal"] }
egui-wgpu = "0.31"
png = "0.17"
taffy = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain access via Security.framework C API — no subprocess, distinct error
# types for ItemNotFound vs AuthFailed (locked keychain). Replaces security CLI.
security-framework = "3"
# CoreMIDI I/O (#320). macOS-only; non-mac builds skip MIDI hardware (mock impl
# stays available under `cfg(test)`).
coremidi = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSThread", "NSString", "NSURL", "NSValue", "NSDictionary", "NSError", "NSObject"] }
# AVFoundation video decoder (#346).
objc2-av-foundation = { version = "0.3", features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-media",
    "objc2-core-foundation",
] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMTime",
    "CMTimeRange",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", features = [
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVPixelFormatDescription",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFString",
    "objc2",
] }

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.31", features = ["wgpu", "eframe"] }

[patch.crates-io]
accesskit_consumer = { path = "deps/accesskit_consumer-0.26.0" }
