[package]
name = "plexi"
version = "1.1.2"
edition = "2021"

[package.metadata.bundle]
name = "Plexi"
identifier = "com.ianjamesburke.plexi"
icon = ["assets/app-icon.icns"]
short_description = "Spatial terminal window manager"
osx_minimum_system_version = "12.0"
osx_info_plist_exts = ["assets/Info.plist.ext"]

[dependencies]
egui = "0.31"
eframe = { version = "0.31", features = ["default_fonts", "wgpu"] }
egui_tiles = { version = "0.12.0", features = ["serde"] }
egui_term = { path = "deps/egui_term" }
dirs = "6"
fern = "0.7"
log = "0.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
rodio = { version = "0.19", default-features = false, features = ["mp3", "flac", "vorbis", "wav"] }
zeroize = "1"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSString", "NSThread", "NSURL"] }
