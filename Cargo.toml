[workspace]
members = ["tools/gen_schema", "tools/gen_cli_docs", "tools/gen_config_docs", "sdk/wasm", "crates/daw-model", "crates/daw-engine", "crates/daw-bundle", "crates/daw-tools", "crates/video-model"]
exclude = ["apps/wasm-poc"]
resolver = "2"

[package]
name = "plexi"
version = "0.2.3"
edition = "2021"

[package.metadata.bundle]
name = "Plexi"
identifier = "com.ianjamesburke.plexi"
icon = ["assets/app-icon.icns"]
short_description = "Spatial terminal window manager"
osx_minimum_system_version = "12.0"
# macOS TCC: triggers the system mic-permission prompt on the first
# `cpal::Stream::play()` call. Without this string the prompt is suppressed
# and capture silently records zeros (#277).
osx_info_plist_exts = ["assets/Info.plist.fragment"]
resources = ["sdk/python/plexi_sdk", "assets/python"]

[[bin]]
name = "plexi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# Keep the core egui crates on one patch generation; their renderer and test
# types cross crate boundaries and cannot tolerate duplicate generations.
egui = "0.34.3"
egui_kittest = { version = "0.34.3", features = ["wgpu", "eframe"] }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = "0.34.3"
egui_tiles = { version = "0.15.0", features = ["serde"] }
# Vendored because Plexi's terminal owns keyboard focus and input extraction;
# upstream egui_term still routes those events through egui's shared queue.
egui_term = { path = "deps/egui_term" }
# Shared editor core (stint 0317): rope buffer + grapheme-aware caret movement.
ropey = "1.6"
# Code-mode syntax highlighting (stint 0318). Pure-Rust regex backend
# (`default-fancy`) — the plain `default` feature pulls the C onig library.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-segmentation = "1.11"
dirs = "6"
fern = "0.7"
log = "0.4"
chrono = "0.4"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# Base64 decode for inline notification image attachments (#74).
base64 = "0.22"
crossbeam-queue = "0.3"
include_dir = "0.7"
zeroize = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Headless renderer (step 1 added src/headless_renderer.rs without declaring these).
tiny-skia = "0.11"
fontdue = "0.9"
# HTTP broker (step 9a). Pure-Rust blocking client — no tokio.
ureq = { version = "2", default-features = false, features = ["tls"] }
# URL parsing for hardened allowed_hosts validation (#1179). Already transitive via ureq.
url = "2"
# Assistant host.files.grep pattern matching (stint 0421). regex-automata/-syntax already transitive.
regex = "1"
# FD CLOEXEC (step 9e). fcntl for close-on-exec on pipe sockets.
libc = "0.2"
# CoreAudio capture + device enumeration (#277). Cross-platform PCM I/O.
cpal = "0.17"
# Host-owned audio playback (#341). Decoder-agnostic; MP3/FLAC/OGG/WAV via default symphonia features.
rodio = "0.22"
# Hot reload (#83). Cross-platform fs watcher; on macOS uses FSEvents.
# `macos_fsevent` is the recommended backend (kqueue is the alt, slower for
# nested dirs). default-features disabled to avoid pulling crossbeam-channel.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
egui_commonmark = "0.23.0"
pulldown-cmark = { version = "0.13", default-features = false }
# Native file picker dialog (#514). Uses NSOpenPanel on macOS.
rfd = "0.17"
# Headless app render (#850). Already transitive via eframe; declared directly for explicit use.
pollster = "0.4"
wgpu = { version = "29", default-features = false, features = ["wgsl", "metal"] }
egui-wgpu = "0.34.3"
taffy = "0.5"
# Single-app package artifact `.plexipkg` (stint 0015): gzipped tar + sha256 manifest.
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
wasmtime = "43.0.2"
wasmtime-wasi = "43.0.2"
bytes = "1"
tokio = { version = "1", features = ["io-util"] }
sysinfo = "0.32"
# Clipboard reads for capability-gated WASM effects. eframe owns writes through egui.
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Background hosts use winit's macOS event-loop activation policy hook.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
# Keychain access via Security.framework C API — no subprocess, distinct error
# types for ItemNotFound vs AuthFailed (locked keychain). Replaces security CLI.
security-framework = "3"
# CoreMIDI I/O (#320). macOS-only; non-mac builds skip MIDI hardware (mock impl
# stays available under `cfg(test)`).
coremidi = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSThread", "NSString", "NSURL", "NSValue", "NSDictionary", "NSError", "NSObject", "NSProcessInfo"] }
# AVFoundation video decoder (#346).
objc2-av-foundation = { version = "0.3", features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-media",
    "objc2-core-foundation",
] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMTime",
    "CMTimeRange",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", features = [
    "CVPixelBuffer",
    "CVImageBuffer",
    "CVBuffer",
    "CVPixelFormatDescription",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFBase",
    "CFString",
    "objc2",
] }

[dev-dependencies]
tempfile = "3"
# DAW release gate (stint 0519): the host test build drives the pure-model
# fuzzer (via the `gate` feature) and the offline render engine, so
# `cargo test --bin plexi` covers every tier. Neither ships in the host binary.
plexi-daw-model = { path = "crates/daw-model", features = ["gate"] }
plexi-daw-engine = { path = "crates/daw-engine" }

[patch.crates-io]
# Vendored because accesskit_consumer 0.38 still panics when a root-change
# update removes the stale focused node before global validation.
accesskit_consumer = { path = "deps/accesskit_consumer-0.38.0" }
# Vendored because upstream 0.23 still hardcodes egui's compact TextEdit margin,
# always shows a transparent copy button over code, and omits link underlines.
egui_commonmark_backend = { path = "deps/egui_commonmark_backend-0.23.0" }
